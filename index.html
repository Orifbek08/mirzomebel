/** Горизонтал устунлар рўйхати */
function ustunlar(l){
  if(!l.length) return bosh('Бу даврда маълумот йўқ');
  var max=Math.max.apply(null,l.map(function(x){ return x.qiy }))||1;
  return '<div class="bl">'+l.map(function(x,i){
    return '<div class="bi">'+
      '<div class="bn">'+esc(x.nom)+(x.ost?'<small>'+esc(x.ost)+'</small>':'')+'</div>'+
      '<div class="btr"><div class="bfl" style="width:'+Math.max(1.5,x.qiy/max*100)+'%;background:'+rang(i)+'"></div></div>'+
      '<div class="bv">'+fmt(x.qiy)+(x.ong?'<small>'+esc(x.ong)+'</small>':'')+'</div>'+
    '</div>';
  }).join('')+'</div>';
}

/** Режа ва факт: яшил тўлдириш + қора чизиқ = режа даражаси */
function rejaUstun(l){
  if(!l.length) return '<div class="empty"><b>План киритилмаган</b>«план» варағини тўлдиринг</div>';
  var max=Math.max.apply(null,l.map(function(x){ return Math.max(x.reja,x.fakt) }))||1;
  l=l.slice().sort(function(a,b){ return raqam(a.rop)-raqam(b.rop) });
  return '<div class="bl">'+l.map(function(x){
    var f=foiz(x.fakt,x.reja);
    var r=f>=100?'var(--green)':f>=60?'var(--ochre)':'var(--red)';
    return '<div class="bi">'+
      '<div class="bn">'+esc(x.rop)+'<small>план '+fmt(x.reja)+' · факт '+fmt(x.fakt)+' · қолди '+fmt(Math.max(0,x.reja-x.fakt))+'</small></div>'+
      '<div class="rjtr"><div class="rjfl" style="width:'+Math.max(1,x.fakt/max*100)+'%;background:'+r+'"></div>'+
      '<div class="rjmark" style="left:calc('+Math.min(99,Math.max(1,x.reja/max*100)).toFixed(1)+'% - 1px)"></div></div>'+
      '<div class="bv" style="color:'+r+'">'+fmt(x.fakt)+'<small>'+f+'%</small></div></div>';
  }).join('')+'</div>';
}

/** Санани танланган қадамга (кун / ҳафта / ой) қисқартиради */
var OYLAR=['янв','фев','март','апр','май','июн','июл','авг','сент','окт','ноя','дек'];

function davrKalit(sana){
  var d=sanaOqi(sana); if(!d) return null;
  if(S.davr==='oy')
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-01';
  if(S.davr==='hafta'){
    var m=new Date(d), dush=(m.getDay()+6)%7;         // ҳафта душанбадан бошланади
    m.setDate(m.getDate()-dush);
    return m.getFullYear()+'-'+('0'+(m.getMonth()+1)).slice(-2)+'-'+('0'+m.getDate()).slice(-2);
  }
  return String(sana).slice(0,10);
}

function davrYorliq(k){
  var d=sanaOqi(k); if(!d) return k;
  if(S.davr==='oy') return OYLAR[d.getMonth()]+' '+String(d.getFullYear()).slice(2);
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2);
}

/**
 * Сотув динамикаси — ҳар бир сана алоҳида устун.
 * Кенглик саналар сонига қараб ўсади, сиғмагани чапга сурилиб кўрилади.
 * Шунинг учун БАРЧА саналар ёрлиғи билан чиқади, ҳеч бири тушиб қолмайди.
 */
/**
 * Силлиқ эгри чизиқ (Catmull-Rom → безье).
 * Нуқталарни синиқ эмас, юмшоқ тўлқин қилиб боғлайди.
 */
function egri(nuq){
  if(nuq.length<2) return nuq.length?('M'+nuq[0][0]+' '+nuq[0][1]):'';
  var d='M'+nuq[0][0].toFixed(1)+' '+nuq[0][1].toFixed(1);
  for(var i=0;i<nuq.length-1;i++){
    var p0=nuq[i-1]||nuq[i], p1=nuq[i], p2=nuq[i+1], p3=nuq[i+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+='C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+','+c2x.toFixed(1)+' '+c2y.toFixed(1)+
       ','+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}

function dinamika(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=davrKalit(x.sana); if(!k) return;
    if(!m[k]){ m[k]={soni:0,pul:0}; t.push(k) }
    m[k].soni+=(x.kishi||1); m[k].pul+=(x.tolangan||0);
  });
  t.sort();
  if(!t.length) return bosh('Бу даврда сотув йўқ');
  if(t.length===1)
    return '<div class="bittakun"><b class="num">'+m[t[0]].soni+'</b>'+
           '<span>'+davrYorliq(t[0])+' — шу битта кунда</span></div>';

  var slot = S.davr==='kun' ? 26 : 52;
  var chap = 46, ong = 26, tep = 34, past = 54;
  /* Чизма панелнинг БУТУН кенглигини эгаллайди; нуқта кўп бўлса
     кенгаяди ва чапга суриб кўрилади. */
  var bor = Math.max(320, (main.clientWidth||960) - 74);
  var W = Math.max(bor, chap+ong+slot*(t.length-1)), H = 252;
  var max = 1;
  t.forEach(function(k){ if(m[k].soni>max) max=m[k].soni });

  var X=function(i){ return chap+(W-chap-ong)*(t.length===1?0:i/(t.length-1)) };
  var Y=function(v){ return tep+(H-tep-past)*(1-v/max) };

  var tor='';
  [0,.5,1].forEach(function(f){
    var y=(tep+(H-tep-past)*(1-f)).toFixed(1);
    tor+='<line class="gl" x1="'+chap+'" y1="'+y+'" x2="'+(W-ong)+'" y2="'+y+'"/>'+
         '<text x="0" y="'+(+y+3)+'">'+fmt(Math.round(max*f))+'</text>';
  });

  var nuq=t.map(function(k,i){ return [X(i),Y(m[k].soni)] });
  var yol=egri(nuq);
  var maydon=yol+'L'+X(t.length-1).toFixed(1)+' '+(H-past)+'L'+X(0).toFixed(1)+' '+(H-past)+'Z';

  /* Жой етарли бўлса — ҲАР БИР сана устида сони турсин */
  var oraliq=(W-chap-ong)/Math.max(1,t.length-1);
  var qadam=Math.max(1,Math.ceil(t.length/12));
  var sonQadam=oraliq>=26 ? 1 : Math.ceil(26/oraliq);
  var belgi='',yorliq='';
  t.forEach(function(k,i){
    var x=X(i), y=Y(m[k].soni), eng=(m[k].soni===max);
    if(t.length<=30 || i%qadam===0 || i===t.length-1 || eng){
      belgi+='<circle class="apt" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(eng?4.8:3.4)+
        '" fill="var(--a)" style="animation-delay:'+(0.5+i*0.012).toFixed(2)+'s">'+
        '<title>'+davrYorliq(k)+': '+m[k].soni+' та</title></circle>';
      yorliq+='<text transform="rotate(-90 '+x.toFixed(1)+' '+(H-past+12)+')" x="'+x.toFixed(1)+
        '" y="'+(H-past+12)+'" text-anchor="end">'+davrYorliq(k)+'</text>';
    }
    if(i%sonQadam===0 || i===t.length-1 || eng)
      belgi+='<text class="vt'+(eng?' eng':'')+'" x="'+x.toFixed(1)+'" y="'+(y-13).toFixed(1)+
        '" text-anchor="middle">'+fmt(m[k].soni)+'</text>';
  });

  var id='g'+Math.floor(Math.random()*1e6);
  return '<div class="dwrap"><svg class="dch" width="'+W+'" height="'+H+'" '+
    'viewBox="0 0 '+W+' '+H+'" style="max-width:100%">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" style="stop-color:var(--a);stop-opacity:.42"/>'+
      '<stop offset="100%" style="stop-color:var(--a);stop-opacity:0"/></linearGradient></defs>'+
    tor+
    '<path class="aarea" d="'+maydon+'" fill="url(#'+id+')"/>'+
    '<path class="aline" d="'+yol+'" fill="none" stroke="var(--a)" stroke-width="2.6" '+
      'stroke-linecap="round" stroke-linejoin="round"/>'+
    belgi+yorliq+'</svg></div>'+
    (W>bor+4 ? '<div class="surish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
      '<path d="M5 12h14M12 5l7 7-7 7"/></svg>Барча саналарни кўриш учун чапга суринг</div>' : '');
}


/** Чизма тепасидаги Кун / Ҳафта / Ой тугмалари ва қисқа хулоса */
function davrQatori(l){
  function b(k,t){ return '<button data-davr="'+k+'" class="'+(S.davr===k?'on':'')+'">'+t+'</button>' }
  var m={},eng=null;
  l.forEach(function(x){
    var k=davrKalit(x.sana); if(!k) return;
    m[k]=(m[k]||0)+(x.kishi||1);
    if(!eng||m[k]>m[eng]) eng=k;
  });
  var oz = eng ? 'Энг фаол: '+davrYorliq(eng)+' \u2014 '+m[eng]+' та сотув' : '';
  return '<div class="davrq"><div class="seg">'+b('kun','Кун')+b('hafta','Ҳафта')+b('oy','Ой')+'</div>'+
    '<div class="oz">'+esc(oz)+'</div></div>';
}


/* ══════════════════════════════════════════════════════
   7. ТАКРОРЛАНУВЧИ БЎЛАКЛАР
   ══════════════════════════════════════════════════════ */

function sanaFiltr(){
  function b(k,t){ return '<button data-o="'+k+'" class="'+(S.oraliq===k?'on':'')+'">'+t+'</button>' }
  var h='<div class="seg">'+b('hammasi','Ҳаммаси')+b('oy','Шу ой')+b('kecha','Кеча')+b('kun','Бугун')+b('oraliq','Сана')+'</div>';
  if(S.oraliq==='oraliq') h+='<div class="sanaqut">'+

}

/* Режим ва янгилаш тугмалари юқори панелга кўчди */
function mobilTugma(){ return '' }

/* Продукт тугмалари энди фақат чап менюда — сарлавҳа устида такрорланмайди */
function produktSwitch(){ return '' }

function eskiBelgi(){
  if(!S.eski) return '';
  return '<div class="eski"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
    '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>'+
    '<span>Сақланган ҳолат кўрсатилмоқда</span><button id="eskiYangila">Янгилаш</button></div>';
}

function sarlavha(h1,izoh,asbob){
  var pt=potok(), arxb='';
  if(pt){
    if(h1.indexOf('RBA')!==0) h1='RBA — '+pt+' · '+h1;
    var av=D&&D.arx&&D.arx[pt]&&D.arx[pt].vaqt;
    arxb='<div class="arxb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h18v13H3z"/><path d="M1 3h22v4H1zM10 12h4"/></svg>'+
      'Архив — ёпилган коуч, маълумоти ўзгармайди'+(av?' · ўқилган: '+esc(String(av).slice(0,16)):'')+'</div>';
  }
  var kvs=K_VARAQ[S.prod]; if(kvs && h1.indexOf(kvs.pre.split(' ·')[0])<0) h1=kvs.pre+h1;
  return produktSwitch()+
    '<div class="head"><div><h1>'+esc(h1)+'</h1><div class="sub">'+esc(izoh)+'</div></div>'+
    '<div class="tools">'+(asbob||'')+'</div></div>'+arxb+eskiBelgi();
}

/** Бўш ҳолат — сана фильтри сабаб бўлса, дарҳол тузатиш тугмаси чиқади */
function bosh(matn){
  var h='<div class="empty"><b>'+esc(matn)+'</b>';
  if(S.oraliq!=='hammasi')
    h+='Сана фильтри торайтириб турибди.'+
       '<div style="margin-top:11px"><button class="btn btn-o" data-o="hammasi">Ҳаммасини кўрсатиш</button></div>';
  return h+'</div>';
}

function bolim(nom,izoh,ichi){
  return '<div class="sec"><h2>'+esc(nom)+'</h2><p>'+esc(izoh)+'</p></div><div class="panel">'+ichi+'</div>';
}

/** Сана бўйича гуруҳланган сотувлар — деталда ва телефонда ишлатилади */
function kunlikRoyxat(l){
  if(!l.length) return '<div class="empty">Сотув йўқ</div>';
  var s=l.slice().sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) });
  var g={},t=[];
  s.forEach(function(x){
    var k=dfmt(x.sana);
    if(!g[k]){ g[k]=[]; t.push(k) }
    g[k].push(x);
  });
  return '<div class="jlist">'+t.map(function(k){
    var lst=g[k],sm=0; lst.forEach(function(x){ sm+=x.tolangan });
    return '<div class="jkun"><div class="jsar"><b>'+k+'</b><span>'+lst.length+' та · '+pul(sm)+'</span></div>'+
      lst.map(function(x){
        var teg=praktikumMi()?x.joy:x.produkt;
        return '<div class="jkart"><div class="jchap">'+
          '<div class="jnom">'+esc(x.fio||'—')+'</div>'+
          '<div class="jmeta">'+esc(teg||'')+'</div></div>'+
          '<div class="jong"><div class="jmiq">'+pul(x.tolangan)+'</div>'+
          '<div class="jxod">'+esc(x.menejer||'—')+'</div></div></div>';
      }).join('')+'</div>';
  }).join('')+'</div>';
}


/* ══════════════════════════════════════════════════════
   8. БЎЛИМ 1 — УМУМИЙ
   «Режа қандай бажарилаяпти?»
   ══════════════════════════════════════════════════════ */

function umumiySahifa(){
  var l=satrlar(), j=jam(l);
  var reja=(DS().reja&&DS().reja[asos()])||[];
  var rJami=0,fJami=0;
  reja.forEach(function(x){ rJami+=x.reja; fJami+=x.fakt });
  var b=foiz(fJami,rJami);

  return sarlavha(
    'Сотув — умумий',
    'План, сотув сони ва пул ҳолати',
    sanaFiltr()+mobilTugma()) +

  '<div class="mets">'+
    '<div class="met o"><div class="met-l">План</div><div class="met-v num">'+fmt(rJami)+'</div>'+
      '<div class="met-d">факт '+fmt(fJami)+' · қолди '+fmt(Math.max(0,rJami-fJami))+
        ' <span style="opacity:.7">(«план» варағидан)</span></div>'+
      '<div class="mprog"><i style="width:'+Math.min(100,b)+'%;background:'+(b>=100?'var(--green)':'var(--ochre)')+'"></i></div></div>'+
    '<div class="met"><div class="met-l">Сотувлар</div><div class="met-v num">'+fmt(j.soni)+'</div>'+
      '<div class="met-d">танланган даврда</div></div>'+
    '<div class="met k"><div class="met-l">Тўланган</div><div class="met-v num">'+pul(j.tolangan)+'</div>'+
      '<div class="met-d">келишув '+pul(j.kelishuv)+'</div></div>'+
    '<div class="met c"><div class="met-l">Қарздорлик</div><div class="met-v num">'+pul(j.qarz)+'</div>'+
      '<div class="met-d">келишувнинг '+foiz(j.qarz,j.kelishuv)+'%</div></div>'+
  '</div>'+

  bolim('План бажарилиши','Ҳар бир РОП бўйича. Қора чизиқ — план даражаси.',rejaUstun(reja))+
  ropDoira(l)+
  bolim('Сотув динамикаси','Ҳар бир санада нечта сотув бўлган',davrQatori(l)+dinamika(l));
}


/* ══════════════════════════════════════════════════════
   9. БЎЛИМ 2 — МЕНЕЖЕРЛАР
   «Ким қанча сотди ва қаерга?»
   ══════════════════════════════════════════════════════ */

function menejerSahifa(){
  var l=satrlar();
  var men=guruhla(l,function(x){ return x.menejer });
  var korinadi=S.qidiruv
    ? men.filter(function(x){ return x.nom.toLowerCase().indexOf(S.qidiruv.toLowerCase())>=0 })
    : men;
  var max=men.length?men[0].soni:1;
  var ochiq=null;
  men.forEach(function(x){ if(x.nom===S.ochiq) ochiq=x });

  var h=sarlavha('Менежерлар','Ким қанча сотган — батафсил учун босинг',
    '<input type="text" id="qid" placeholder="Исм бўйича қидириш" value="'+esc(S.qidiruv)+'" style="width:180px">'+
    sanaFiltr()+mobilTugma());

  h+='<div class="grid">'+(korinadi.length?korinadi.map(function(x){
    var n=men.indexOf(x);
    var kon=konversiya(x.nom);
    var kt=kon ? ' · конверсия '+konvMatn(kon) : '';
    return '<button class="card '+(S.ochiq===x.nom?'sel':'')+'" data-men="'+esc(x.nom)+'">'+
      '<span class="rank">#'+(n+1)+'</span>'+
      '<div class="cn">'+esc(x.nom)+'</div>'+
      '<div class="cm">'+pul(x.tolangan)+kt+'</div>'+
      '<div class="cq"><b class="num">'+fmt(x.soni)+'</b><span>та сотув</span></div>'+
      '<div class="cbar"><i style="width:'+Math.max(3,x.soni/max*100)+'%;background:'+rang(n)+'"></i></div>'+
    '</button>';
  }).join(''):'<div class="empty">Менежер топилмади</div>')+'</div>';

  if(ochiq) h+=menejerDetal(ochiq);

  if(DS().konversiya && DS().konversiya.length)
    h+='<div class="sub" style="margin:14px 0 0">Конверсия «menedjer konversiya» варағидан олинади '+
       'ва сана фильтрига боғлиқ эмас.</div>';

  h+='<div class="sec"><h2>Умумий жадвал</h2>'+
     '<p>Қаторлар — менежерлар, устунлар — '+esc(kesim().nom.toLowerCase())+'. Катакда сотув сони.</p></div>'+
     '<div class="panel">'+matritsa(l)+'</div>';
  return h;
}

function menejerDetal(o){
  var k=kesim();
  var bolinish=tartibla(guruhla(o.satrlar,k.ol));
  var kon=konversiya(o.nom);
  var konChip = kon
    ? '<span class="chip">Конверсия <b>'+konvMatn(kon)+'</b> · '+
      fmt(kon.sotuv)+' сотув, '+fmt(kon.kelmagan)+' келмаган</span>'
    : '';
  return '<div class="detail">'+
    '<div class="dh"><div class="dm"><h3>'+esc(o.nom)+'</h3>'+
      '<div class="chips">'+
        '<span class="chip">Сотув: <b>'+fmt(o.soni)+'</b></span>'+
        '<span class="chip k">Тўланган <b>'+pul(o.tolangan)+'</b></span>'+
        '<span class="chip c">Қарз <b>'+pul(o.qarz)+'</b></span>'+
        konChip+
      '</div></div>'+
      '<button class="btn" data-yop>Ёпиш</button></div>'+
    '<div class="dbody"><div class="eb">Қаерга сотган</div>'+
      ustunlar(bolinish.map(function(x){
        return {nom:x.nom, qiy:x.soni, ost:kunIzoh(x.nom), ong:pul(x.tolangan)};
      }))+'</div>'+
    '<div class="dbody"><div class="eb">Қачон сотган</div>'+kunlikRoyxat(o.satrlar)+'</div>'+
  '</div>';
}

/** Менежер × шаҳар (ёки продукт) жадвали */
function matritsa(l){
  var k=kesim();
  var men=guruhla(l,function(x){ return x.menejer });
  if(!men.length) return '<div class="empty">Маълумот йўқ</div>';

  var ustun=[];
  l.forEach(function(x){ var v=k.ol(x)||'—'; if(ustun.indexOf(v)<0) ustun.push(v) });
  ustun.sort(function(a,b){
    var f=raqam(a)-raqam(b);
    return f!==0 ? f : String(a).localeCompare(String(b));
  });

  var katak={},max=0;
  l.forEach(function(x){
    var a=(x.menejer||'—')+'|'+(k.ol(x)||'—');
    katak[a]=(katak[a]||0)+1;
    if(katak[a]>max) max=katak[a];
  });

  var h='<div class="mw"><table class="mx"><thead><tr><th class="hd">Менежер</th>';
  ustun.forEach(function(u){ h+='<th>'+esc(u)+'</th>' });
  h+='<th style="padding-left:10px">Жами</th></tr></thead><tbody>';

  men.forEach(function(m,mi){
    var jami=0,td='';
    ustun.forEach(function(u){
      var v=katak[m.nom+'|'+u]||0; jami+=v;
      var bg='var(--z0)',col='var(--z0f)';
      if(v>0){
        var n=v/max;
        if(n>=.6){ bg='var(--z3)'; col='var(--z3f)' }
        else if(n>=.25){ bg='var(--z2)'; col='var(--z2f)' }
        else { bg='var(--z1)'; col='var(--z1f)' }
      }
      td+='<td><div class="cell" style="background:'+bg+';color:'+col+'">'+(v||'·')+'</div></td>';
    });
    h+='<tr><th class="hd"><span class="rn"><i class="sw" style="background:'+rang(mi)+'"></i>'+esc(m.nom)+'</span></th>'+
       td+'<td style="padding-left:10px"><b class="num">'+fmt(jami)+'</b></td></tr>';
  });

  return h+'</tbody></table></div>'+
    '<div class="lg"><span><i style="background:var(--z3)"></i>кўп</span>'+
    '<span><i style="background:var(--z2)"></i>ўртача</span>'+
    '<span><i style="background:var(--z1)"></i>кам</span>'+
    '<span><i style="background:var(--z0)"></i>йўқ</span></div>';
}


/**
 * РОП кесими — иккита доира: сотув сони ва тўланган пул.
 * Кимнинг улуши катталигини бир қарашда кўрсатади.
 */
function ropDoira(l){
  var g=guruhla(l,function(x){ return x.rop });
  if(g.length<2) return '';
  g=g.slice().sort(function(a,b){ return raqam(a.nom)-raqam(b.nom) });

  var soni=g.map(function(x){ return {nom:x.nom,summa:x.soni,soni:x.soni} });
  var pull=g.filter(function(x){ return x.tolangan>0 })
            .map(function(x){ return {nom:x.nom,summa:x.tolangan,soni:x.soni} });

  var h='<div class="two" style="margin-top:16px">'+
    '<div><div class="sec" style="margin-top:0"><h2>РОП улуши — сотув сони</h2>'+
      '<p>Ким нечта сотган</p></div>'+
    '<div class="panel">'+mDoira(soni,'var(--green)',function(v){ return fmt(v) })+'</div></div>';
  h+= pull.length
    ? '<div><div class="sec" style="margin-top:0"><h2>РОП улуши — тўланган пул</h2>'+
      '<p>Ким қанча пул киритган</p></div>'+
      '<div class="panel">'+mDoira(pull,'var(--green)',function(v){ return pul(v) })+'</div></div>'
    : '';
  return h+'</div>';
}

/* ══════════════════════════════════════════════════════
   9.5 ХАРИТА — 3 кунлик тадбирлар географияси
   Тўртта давлат: Ўзбекистон, Қозоғистон, Қирғизистон, Тожикистон

/* ── ҲАҚИҚИЙ ДАВЛАТ ЧЕГАРАЛАРИ ──────────────────────────
   Манба: Natural Earth (world.geo.json), соддалаштирилган.
   Проекция: эквидистант, ўрта кенгликка мослаб чўзилган. */
var XARITA_W=752.7, XARITA_H=496.8;
var XARITA_PROY={lon0:62.6,lat1:44.2,kx:54.5447,k:72.0};

/**
 * «6 Тошкент» → шаҳар маълумоти.
 * ⚠ Диққат: «тошкент» ичида «ош» бор, шунинг учун ичидан излаш МУМКИН ЭМАС —
 *   фақат тўлиқ мослик текширилади.
 */
function shaharNorm(nom){
  return String(nom||'').toLowerCase()
    .replace(/ў/g,'у').replace(/қ/g,'к').replace(/ғ/g,'г').replace(/ҳ/g,'х')
    .replace(/ы/g,'и').replace(/ё/g,'е').replace(/й/g,'и')
    .replace(/[\s\d.,\-—]/g,'');
}

function shaharTop(nom){
  var t=shaharNorm(nom);
  if(!t) return null;
  for(var i=0;i<SHAHAR.length;i++)
    if(t===shaharNorm(SHAHAR[i].kalit)) return SHAHAR[i];
  return null;
}


/**
 * Тадбирлар харитаси.
 * Доира катталиги — сотув сони, ранги — давлат.
 * ⚠ Бу схематик харита: шаҳарлар ҳақиқий координаталари бўйича
 *   жойлаштирилган, лекин давлат чегаралари чизилмаган.
 */
/** Координатани харита нуқтасига айлантиради */
function xproy(lon,lat){
  var p=XARITA_PROY;
  return [ (lon-p.lon0)*p.kx, (p.lat1-lat)*p.k ];
}

/**
 * ТАДБИРЛАР ХАРИТАСИ — ҳақиқий давлат чегаралари билан.
 * Шаҳарлар аниқ координатасида туради; ном ва изоҳ ёнига чиқарилиб,
 * бир-бирига халақит бермаслиги учун сурилади (ингичка чизиқ билан боғланади).
 */
function xarita(guruh, mijoz){
  var nuq=[];
  guruh.forEach(function(g){
    var sh=shaharTop(g.nom);
    if(sh) nuq.push({sh:sh, g:g});
  });
  if(!nuq.length) return '';

  var birlik = mijoz ? ' та мижоз' : ' та сотув';
  var W=XARITA_W, H=XARITA_H;
  var max=1, jami=0;
  nuq.forEach(function(x){ if(x.g.soni>max) max=x.g.soni; jami+=x.g.soni; });

  // ── давлатлар ──
  var davKod={'Ўзбекистон':'uz','Қозоғистон':'kz','Қирғизистон':'kg','Тожикистон':'tj','Туркманистон':'tm'};
  var dav={};
  nuq.forEach(function(x){
    var d=x.sh.davlat;
    if(!dav[d]) dav[d]={nom:d,soni:0,shahar:0};
    dav[d].soni+=x.g.soni; dav[d].shahar++;
  });

  var yer='';
  ['tm','kz','uz','kg','tj'].forEach(function(k,i){     // tm аввал — Ўзбекистон чегараси устидан чизилади
    var nomi=null;
    for(var d in davKod) if(davKod[d]===k) nomi=d;
    var bor=!!dav[nomi];
    yer+='<path class="xyer'+(bor?' faol':'')+'" d="'+XARITA_YOL[k]+'" '+
      'fill="'+(bor?DAVLAT_RANG[nomi]:'var(--line)')+'" '+
      'stroke="'+(bor?DAVLAT_RANG[nomi]:'var(--line2)')+'" '+
      'style="animation-delay:'+(i*0.09).toFixed(2)+'s"><title>'+nomi+
      (bor?' — '+fmt(dav[nomi].soni)+birlik:'')+'</title></path>';
  });

  // ── шаҳар нуқталари ──
  var P=nuq.map(function(x){
    // Харитадан ташқаридаги давлат (Россия) — юқори четда туради
    var c=x.sh.chet==='yuqori' ? [x.sh.cx||118, 46] : xproy(x.sh.lon,x.sh.lat);
    return { x:c[0], y:c[1], r:9+15*Math.sqrt(x.g.soni/max), it:x };
  });

  /* Ёзувни доиранинг ЁНИГА чиқарамиз (тагига эмас) —
     Тошкент, Шимкент ва Хўжанд бир вертикалда тургани учун
     тагига қўйилса устма-уст тушади. */
  P.sort(function(a,b){ return a.y-b.y });
  var ENI=96;                                  // ёзув эгаллайдиган тахминий кенглик
  P.forEach(function(p){
    p.ong = p.x < XARITA_W*0.62;               // ўнгда жой борми
    p.lx = p.ong ? p.x+p.r+10 : p.x-p.r-10;
    p.ly = p.y-1;
  });
  /* Ёзувлар бир-бирини босмаслиги учун вертикал суриб чиқарамиз.
     Чапга ва ўнгга ёзилганлар турли томонга чўзилади, шунинг учун
     фақат lx эмас, ёзувнинг БУТУН эгаллаган жойи солиштирилади. */
  function chap(p){ return p.ong ? p.lx : p.lx-ENI }
  function ong(p){  return p.ong ? p.lx+ENI : p.lx }
  for(var q=0;q<220;q++){
    for(var i=0;i<P.length;i++){
      for(var j=i+1;j<P.length;j++){
        if(chap(P[i])>ong(P[j]) || ong(P[i])<chap(P[j])) continue;   // кесишмайди
        var dy=P[j].ly-P[i].ly, d=Math.abs(dy);
        if(d<42){
          var s2=(42-d)/2*(dy<0?-1:1);
          P[i].ly-=s2; P[j].ly+=s2;
        }
      }
    }
  }
  P.forEach(function(p){ p.ly=Math.max(22,Math.min(H-24,p.ly)) });

  var shar='';
  P.forEach(function(p,i){
    var x=p.it, t=mijoz?null:tadbir(x.g.nom);
    var kutil=t && !t.otdi;
    var c=DAVLAT_RANG[x.sh.davlat];
    var uch=p.ong ? p.x+p.r : p.x-p.r;
    var chiziq='<line class="xulash" x1="'+uch.toFixed(1)+'" y1="'+p.y.toFixed(1)+
      '" x2="'+p.lx.toFixed(1)+'" y2="'+p.ly.toFixed(1)+'" stroke="'+c+'"/>';
    var yon=p.ong?'start':'end';
    // Харитадан ташқаридаги давлат: доирадан юқорига стрелка
    var chet=x.sh.chet==='yuqori'
      ? '<line class="xchet" x1="'+p.x.toFixed(1)+'" y1="'+(p.y-p.r).toFixed(1)+'" x2="'+p.x.toFixed(1)+'" y2="4" stroke="'+c+'"/>'+
        '<path d="M'+(p.x-5).toFixed(1)+' 10L'+p.x.toFixed(1)+' 3L'+(p.x+5).toFixed(1)+' 10" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/>'
      : '';
    shar+='<g class="xsh'+(S.ochiq===x.g.nom?' tanlangan':'')+'" data-kes="'+esc(x.g.nom)+
      '" style="animation-delay:'+(0.4+i*0.09).toFixed(2)+'s">'+chiziq+chet+
      (kutil?'<circle class="xpuls" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+p.r.toFixed(1)+
        '" fill="'+c+'"/>':'')+
      '<circle class="xdoira" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+p.r.toFixed(1)+
        '" fill="'+c+'" fill-opacity="'+(kutil?.55:.34)+'" stroke="'+c+'" stroke-width="2"/>'+
      '<text class="xson" x="'+p.x.toFixed(1)+'" y="'+p.y.toFixed(1)+'" text-anchor="middle" '+
        'dominant-baseline="central">'+fmt(x.g.soni)+'</text>'+
      '<text class="xnom" x="'+p.lx.toFixed(1)+'" y="'+(p.ly-3).toFixed(1)+'" text-anchor="'+yon+'">'+
        esc(x.sh.nom)+'</text>'+
      '<text class="xizoh" x="'+p.lx.toFixed(1)+'" y="'+(p.ly+11).toFixed(1)+'" text-anchor="'+yon+'" '+
        'fill="'+(kutil?c:'currentColor')+'">'+
        (t?(t.otdi?'бўлиб ўтди':t.kun+' кун қолди')
           :x.sh.chet==='yuqori'?'шимолда ↑'
           :(mijoz&&jami?Math.round(x.g.soni/jami*100)+'%':''))+'</text>'+
      '<title>'+esc(x.sh.nom)+(x.sh.nom===x.sh.davlat?'':' · '+x.sh.davlat)+' — '+fmt(x.g.soni)+birlik+'</title></g>';
  });

  var tashqari=guruh.filter(function(g){ return !shaharTop(g.nom) });
  var chip = tashqari.length
    ? '<div class="xtashq">'+tashqari.map(function(g){

    return '<span><i style="background:'+DAVLAT_RANG[d]+'"></i>'+d+' <b>'+fmt(dav[d].soni)+'</b></span>';

   «Қаерга сотилди ва ким сотди?»

function kesimSahifa(){
  var l=satrlar(), k=kesim();
  var guruh=tartibla(guruhla(l,k.ol));
  var max=1;
  guruh.forEach(function(x){ if(x.soni>max) max=x.soni });
  var ochiq=null;
  guruh.forEach(function(x){ if(x.nom===S.ochiq) ochiq=x });

  var h=sarlavha(praktikumMi()?'Маҳсулот':'Продукт',
    'Қаерга қанча сотилган — батафсил учун босинг',
    sanaFiltr()+mobilTugma());

  h+='<div class="grid">'+(guruh.length?guruh.map(function(x,i){
    return '<button class="card '+(S.ochiq===x.nom?'sel':'')+'" data-kes="'+esc(x.nom)+'">'+
      '<div class="cn">'+esc(x.nom)+'</div>'+
      '<div class="cm">'+(kunIzoh(x.nom)||pul(x.tolangan))+'</div>'+
      '<div class="cq"><b class="num">'+fmt(x.soni)+'</b><span>та сотув</span></div>'+
      '<div class="cbar"><i style="width:'+Math.max(3,x.soni/max*100)+'%;background:'+rang(i)+'"></i></div>'+
    '</button>';
  }).join(''):'<div class="empty">Маълумот йўқ</div>')+'</div>';

  if(ochiq){
    var men=guruhla(ochiq.satrlar,function(x){ return x.menejer });
    h+='<div class="detail">'+
      '<div class="dh"><div class="dm"><h3>'+esc(ochiq.nom)+'</h3>'+
        '<div class="sub">'+esc(kunIzoh(ochiq.nom))+'</div>'+
        '<div class="chips">'+
          '<span class="chip">Сотув: <b>'+fmt(ochiq.soni)+'</b></span>'+
          '<span class="chip k">Тўланган <b>'+pul(ochiq.tolangan)+'</b></span>'+
          '<span class="chip c">Қарз <b>'+pul(ochiq.qarz)+'</b></span>'+
        '</div></div>'+
        '<button class="btn" data-yop>Ёпиш</button></div>'+
      '<div class="dbody"><div class="eb">Ким сотган</div>'+
        ustunlar(men.map(function(x){ return {nom:x.nom,qiy:x.soni,ong:pul(x.tolangan)} }))+'</div>'+
      '<div class="dbody"><div class="eb">Қачон сотилган</div>'+kunlikRoyxat(ochiq.satrlar)+'</div>'+
    '</div>';
  }

  // ── Саҳифа охири: мижозлар географияси + манбалар (фақат 3 кунлик) ──
  if(praktikumMi()) h+=mijozGeo(l);

  return h;
}

/**
 * МИЖОЗЛАР ГЕОГРАФИЯСИ — «Давлати» устуни бўйича.
 * Тадбир қаерда бўлгани эмас, МИЖОЗ қаердан экани кўрсатилади.
 */
function mijozGeo(l){
  var h='';

  /* «Давлати» устуни тўлдирилган қаторлар. Бўшлари фоизни бузмаслиги учун
     ҳисобдан чиқарилади, лекин сони пастда айтиб ўтилади. */
  var bilan=l.filter(function(x){ return x.davlat });
  var yoq=l.length-bilan.length;

  if(bilan.length){
    /* Ёзилиши ҳар хил бўлса ҳам битта давлат битта сатр бўлсин:
       «Киргизистан» ва «Қирғизистон» — бир хил ҳисобланади. */
    var geo=guruhla(bilan,function(x){
      var d=davlatTop(x.davlat);
      return d ? d.nom : x.davlat;
    });
    var xrt=xaritaDavlat(geo);
    var jami=0;
    geo.forEach(function(g){ jami+=g.soni });

    h+='<div class="sec"><h2>Мижозлар географияси</h2>'+
       '<p>Мижоз қайси давлатдан — доира катталиги мижозлар сони</p></div>';
    if(xrt) h+=xrt;

    h+='<div class="dbody"><div class="eb">Давлатлар бўйича мижозлар</div>'+
      ustunlar(geo.map(function(x){
        return { nom:x.nom, qiy:x.soni,
                 ong: jami?Math.round(x.soni/jami*100)+'%':'' };
      }))+
      (yoq?'<div class="sub" style="margin-top:12px">Яна '+fmt(yoq)+
           ' та сотувда «Давлати» устуни тўлдирилмаган</div>':'')+
      '</div>';
  }

  // ── Манбалар (Источник) ──
  if(l.some(function(x){ return x.manba })){
    var mn=guruhla(l,function(x){ return x.manba || 'Кўрсатилмаган' });
    var mj=0;
    mn.forEach(function(g){ mj+=g.soni });
    h+='<div class="sec"><h2>Манбалар</h2><p>Мижоз қайси манбадан келган</p></div>'+
      '<div class="dbody">'+ustunlar(mn.map(function(x){
        return { nom:x.nom, qiy:x.soni,
                 ong: (mj?Math.round(x.soni/mj*100)+'% · ':'')+pul(x.tolangan) };
      }))+'</div>';
  }

  return h;
}

   14. МОЛИЯ — «Пул қаердан келди ва қаерга кетди?»
   Манба: «Финансе орг» варағи (алоҳида жадвал, алоҳида API)
   ══════════════════════════════════════════════════════ */

function moliyaMi(){ return S.prod==='moliya' }

/** Молия ёзувлари: сана фильтри + валюта фильтри */
function mSatrlar(){
  var l=((D&&D.moliya)||[]).filter(function(x){ return x.valyuta===S.valyuta });
  return sanaFiltrla(l);
}

/** Валюта белгиси билан сумма */
function mpul(v){
  return S.valyuta==='USD' ? '$'+fmt(v) : fmt(v)+' TJS';
}

/** Қисқа кўриниш: 1 830 000 → 1.8 млн (метрикалар учун) */
function mqisqa(v){
  var a=Math.abs(v), b=v<0?'−':'';
  if(S.valyuta==='USD') return b+'$'+fmt(a);
  if(a>=1e9) return b+(a/1e9).toFixed(a>=1e10?0:1).replace('.',',')+' млрд';
  if(a>=1e6) return b+(a/1e6).toFixed(a>=1e8?0:1).replace('.',',')+' млн';
  if(a>=1e3) return b+Math.round(a/1e3)+' минг';
  return b+fmt(a);
}

/** Кирим/чиқим бўйича жамлаш */
function mJam(l){
  var o={kirim:0,chiqim:0,soni:l.length};
  l.forEach(function(x){ if(x.tip==='kirim') o.kirim+=x.summa; else o.chiqim+=x.summa });
  o.farq=o.kirim-o.chiqim;
  return o;
}

/** Калит бўйича гуруҳлаб, суммаси бўйича тартиблайди */
function mGuruh(l,ol){
  var m={},t=[];
  l.forEach(function(x){
    var k=ol(x)||'—';
    if(!m[k]){ m[k]={nom:k,summa:0,soni:0,satrlar:[]}; t.push(k) }
    m[k].summa+=x.summa; m[k].soni++; m[k].satrlar.push(x);
  });
  return t.map(function(k){ return m[k] }).sort(function(a,b){ return b.summa-a.summa });
}

/** Валюта танлаш тугмалари */
function valyutaSeg(){
  function b(v){ return '<button data-val="'+v+'" class="'+(S.valyuta===v?'on':'')+'">'+
    (v==='UZS'?'TJS':'$ USD')+'</button>' }
  return '<div class="seg">'+b('UZS')+b('USD')+'</div>';
}

/** Молия улданмаган ёки маълумот йўқ бўлса */
function mBoshHolat(){
  var bor=!!(D && D.moliya && D.moliya.length);   // олдин юкланган маълумот бор — янгиланаётганда ҳам шуни кўрсатамиз
  if(!bor && (S.mBand || (moliyaUlangan() && D && !D.moliya && !D.moliyaXato)))
    return '<div class="load"><div class="spin"></div>Финанс маълумоти юкланмоқда…</div>';
  if(!moliyaUlangan())
    return '<div class="empty"><b>Молия уланмаган</b>HTML файлдаги <b>API_MOLIYA</b> га '+
           'Moliya.gs дан чиққан ҳаволани қўйинг.</div>';
  if(D.moliyaXato && !bor)
    return '<div class="xato"><b>Молия серверига уланиб бўлмади</b>'+esc(D.moliyaXato)+
      '<div style="margin-top:10px;font-size:12.5px">Текширинг: Moliya.gs '+
      '<b>Deploy → Anyone</b> қилинганми ва Moliya.gs 4.0 версиями.</div></div>';
  if(!D.moliya || !D.moliya.length) return tashxisPanel();
  return '';
}

/**
 * Ёзув ўқилмаганда — сабабини рақамлар билан кўрсатади.
 * Энг муҳими: ТиП устунида АСЛИДА қандай қийматлар борлиги.

  var t=D.moliyaTashxis;
  var v=D.moliyaVersiya;

  // Эски версия ишлаётган бўлса — биринчи навбатда шуни айтамиз
  if(!t){
    return '<div class="tsh"><h3>Ёзув ўқилмади</h3>'+
      '<p>Сервер ташхис юбормади — демак <b>эски версия</b> ишлаяпти.</p>'+
      '<div class="tshq"><b>Нима қилиш керак</b><br>'+
      'Apps Script → Deploy → Manage deployments → ✏ → '+
      'Version: <b>New version</b> → Deploy</div></div>';
  }

  var q=[
    ['Скрипт версияси', v||'номаълум'],
    ['Ўқилган варақ', '«'+t.varaq+'»'],
    ['Варақдаги қаторлар', fmt(t.jamiQator)+' та'],
    ['Бўш қаторлар', fmt(t.boshQator||0)+' та'],
    ['✅ Ўқилди', fmt(t.oqilgan)+' та']
  ];
  if(t.tipsiz)   q.push(['⚠ ТиП тушунарсиз', fmt(t.tipsiz)+' та']);
  if(t.sanasiz)  q.push(['⚠ Сана йўқ', fmt(t.sanasiz)+' та']);
  if(t.summasiz) q.push(['⚠ Сумма 0', fmt(t.summasiz)+' та']);

  var h='<div class="tsh"><h3>Ёзув ўқилмади</h3>'+
    '<table class="tshj">'+q.map(function(x){
      return '<tr><td>'+esc(x[0])+'</td><td><b>'+esc(x[1])+'</b></td></tr>' }).join('')+'</table>';

  if(t.tipQiymatlar && t.tipQiymatlar.length){
    h+='<div class="eb" style="margin-top:16px">ТиП устунида нима ёзилган</div><table class="tshj">'+
      t.tipQiymatlar.map(function(x){
        var ok=/приход|расход|кирим|чиким|kirim|chiqim|доход|харажат/i.test(x.qiymat);
        return '<tr><td>«'+esc(x.qiymat)+'»</td><td>'+fmt(x.soni)+' та</td>'+
          '<td style="color:'+(ok?'var(--green)':'var(--red)')+'">'+(ok?'тушунарли':'тушунарсиз')+'</td></tr>';
      }).join('')+'</table>';
  }else{
    h+='<div class="tshq">ТиП устуни бўш — «Приход» ёки «Расход» ёзилмаган.</div>';
  }

  h+='<div class="eb" style="margin-top:16px">Топилган сарлавҳалар</div>'+
     '<div class="tshs">'+t.sarlavha.map(function(x){ return '<span>'+esc(x)+'</span>' }).join('')+'</div>';

  if(v!=='2.0')
    h+='<div class="tshq">⚠ Сервердаги версия — <b>'+esc(v||'номаълум')+'</b>, кутилгани <b>2.0</b>.<br>'+
       'Apps Script → Deploy → Manage deployments → ✏ → Version: <b>New version</b> → Deploy</div>';

  return h+'</div>';

/**
 * КАССАДАГИ ҚОЛДИҚ — ҳозир ҳар бир кассада қанча пул борлиги.
 * Ҳисоб оддий: кирим − чиқим. Пастда ҳаммасининг йиғиндиси.
 */
/** Инвестиция кассаси — «жами» қолдиққа қўшилмайди (номида «инвест» бор касса) */
/* «Инвестиция», «Интвеститсия», «Инвестция» — ёзилиши ҳар хил бўлиши мумкин */
function invMi(k){ return /ин[т]?в[еэ]с?т|invest/i.test(String(k||'')) }

function mKassaBlok(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=x.kassa||'Кўрсатилмаган';
    if(!m[k]){ m[k]={nom:k,kirim:0,chiqim:0,soni:0}; t.push(k) }
    var g=m[k];
    g.soni++;
    if(x.tip==='kirim') g.kirim+=x.summa; else g.chiqim+=x.summa;
  });
  if(!t.length) return bosh('Бу даврда маълумот йўқ');

  var q=t.map(function(k){ var g=m[k]; g.qoldiq=g.kirim-g.chiqim; return g })
         .sort(function(a,b){ return b.qoldiq-a.qoldiq });

  var jami={kirim:0,chiqim:0,soni:0}, inv=[];
  q.forEach(function(g){
    if(invMi(g.nom)){ inv.push(g); return }          // инвестиция жамига кирмайди
    jami.kirim+=g.kirim; jami.chiqim+=g.chiqim; jami.soni+=g.soni;
  });
  jami.qoldiq=jami.kirim-jami.chiqim;

  var eng=1;
  q.forEach(function(g){ if(Math.abs(g.qoldiq)>eng) eng=Math.abs(g.qoldiq) });

  var h='<div class="kgrid">'+q.map(function(g){
    var manfiy=g.qoldiq<0;
    return '<div class="kk'+(manfiy?' minus':'')+(invMi(g.nom)?' kinv':'')+'">'+
      '<div class="knom">'+esc(g.nom)+(invMi(g.nom)?'<em class="kinvb">жамига кирмайди</em>':'')+'</div>'+
      '<div class="kson num">'+mqisqa(g.qoldiq)+'</div>'+
      '<div class="kpul">'+mpul(Math.abs(g.qoldiq))+(manfiy?' минусда':'')+'</div>'+
      '<div class="kbar"><i style="width:'+Math.max(2,Math.abs(g.qoldiq)/eng*100)+'%"></i></div>'+
      '<div class="kqat">'+
        '<span><i class="kd kdk"></i>кирим</span><b class="num">'+mqisqa(g.kirim)+'</b></div>'+
      '<div class="kqat">'+
        '<span><i class="kd kdc"></i>чиқим</span><b class="num">'+mqisqa(g.chiqim)+'</b></div>'+
      '<div class="kqat kson2"><span>'+fmt(g.soni)+' та ёзув</span></div>'+
    '</div>';
  }).join('')+'</div>';

  h+='<div class="kjami'+(jami.qoldiq<0?' minus':'')+'">'+
    '<div><div class="kjl">Ҳамма кассада жами</div>'+
      '<div class="kjv num">'+mqisqa(jami.qoldiq)+'</div>'+
      '<div class="kjd">'+mpul(Math.abs(jami.qoldiq))+(jami.qoldiq<0?' минусда':'')+'</div></div>'+
    '<div class="kjo">'+
      '<div><span>кирим</span><b class="num">'+mqisqa(jami.kirim)+'</b></div>'+
      '<div><span>чиқим</span><b class="num">'+mqisqa(jami.chiqim)+'</b></div>'+
      '<div><span>ёзувлар</span><b class="num">'+fmt(jami.soni)+'</b></div>'+
    '</div></div>';
  if(inv.length)
    h+='<div class="kinvn">Жамига кирмади: '+inv.map(function(g){
      return '<b>'+esc(g.nom)+'</b> '+mqisqa(g.qoldiq) }).join(' · ')+' — инвестиция алоҳида ҳисобланади</div>';

  return h;
}

/**
 * Доира диаграмма — фоизлар билан.
 * Ўртасида жами, ёнида рўйхат: ном, фоиз, сумма.
 */
function mDoira(guruh, rang, fmtFn){
  var F=fmtFn||mqisqa;
  if(!guruh.length) return bosh('Маълумот йўқ');
  var jami=0; guruh.forEach(function(x){ jami+=x.summa });
  if(!jami) return bosh('Маълумот йўқ');

  var top=guruh.slice(0,7);
  var qolgan=guruh.slice(7);
  if(qolgan.length){
    var q={nom:'Бошқалари',summa:0,soni:0};
    qolgan.forEach(function(x){ q.summa+=x.summa; q.soni+=x.soni });
    if(q.summa>0) top=top.concat([q]);
  }

  var R=62, qalin=30, C=2*Math.PI*R, siljish=0, halqa='', ichYorliq='';
  var AJRAT=5;                                  // бўлаклар орасидаги қора чизиқ
  top.forEach(function(x,i){
    var ul=x.summa/jami*C;
    if(ul<=0) return;
    var f=x.summa/jami*100;
    var kor=Math.max(0.5,ul-AJRAT);
    halqa+='<circle class="dsek" cx="90" cy="90" r="'+R+'" fill="none" stroke="'+mRang(i,rang)+'" '+
      'stroke-width="'+qalin+'" stroke-dasharray="0 '+C.toFixed(2)+'" '+
      'stroke-dashoffset="'+(-siljish-AJRAT/2).toFixed(2)+'" transform="rotate(-90 90 90)" '+
      'style="--ul:'+kor.toFixed(2)+';--bo:'+(C-kor).toFixed(2)+';animation-delay:'+
      (0.15+i*0.09).toFixed(2)+'s"><title>'+esc(x.nom)+': '+F(x.summa)+
      ' ('+(f>=10?Math.round(f):f.toFixed(1))+'%)</title></circle>';

    if(f>=6){
      var brc=(siljish+ul/2)/C*360-90;
      var rad=brc*Math.PI/180;
      ichYorliq+='<text class="dich" x="'+(90+R*Math.cos(rad)).toFixed(1)+'" y="'+
        (90+R*Math.sin(rad)).toFixed(1)+'" text-anchor="middle" dominant-baseline="central" '+
        'style="animation-delay:'+(0.7+i*0.07).toFixed(2)+'s">'+
        (f>=10?Math.round(f):f.toFixed(1))+'%</text>';
    }
    siljish+=ul;
  });

  return '<div class="doira">'+
    '<svg class="chart dsvg" viewBox="0 0 180 180">'+halqa+ichYorliq+
      '<text class="dt" x="90" y="86" text-anchor="middle">'+F(jami)+'</text>'+
      '<text class="dl" x="90" y="103" text-anchor="middle">жами</text></svg>'+
    '<div class="dleg">'+top.map(function(x,i){
      var f=jami?x.summa/jami*100:0;
      return '<div class="dlq" style="animation-delay:'+(0.25+i*0.06).toFixed(2)+'s">'+
        '<i style="background:'+mRang(i,rang)+'"></i>'+
        '<span class="dnom">'+esc(x.nom)+'</span>'+
        '<b class="dfo">'+(f>=10?Math.round(f):f.toFixed(1))+'%</b>'+
        '<span class="dsum">'+F(x.summa)+'</span></div>';
    }).join('')+'</div></div>';
}


/** Диаграмма учун ранг: ҳар бир бўлак ўз рангида (биринчиси — кирим яшил / чиқим қизил).
    Ранглар етарлича тўқ — устидаги оқ фоиз ёзуви ҳамма бўлакда ўқилади */
function mRang(i,asos){
  var umumiy=['#2F6FA8','#D07A2B','#7A5CA8','#1E8E9E','#B8862B','#A04A7A','#5F7D8E','#3E7D53'];
  var bir=(asos==='var(--red)')?'#C0524A':'#2E9670';
  return i===0 ? bir : umumiy[(i-1)%umumiy.length];
}


/** Энг йирик моддалар — 2-даража (Стадия) кесимида */
function mTopModda(l,tip,rang){
  var g=mGuruh(l.filter(function(x){ return x.tip===tip }),
               function(x){ return x.stadiya||x.asosiy||'—' }).slice(0,8);
  return mUstunlar(g,rang);
}

/**
 * Саҳифа тагидаги изоҳ — ҳозир НИМА кўрсатилаётганини айтади.
 * Фильтр қўйилганда чалкашмаслик учун.
 */
function filtrIzoh(l){
  var d=['Ҳаммаси','Шу ой','Кеча','Бугун','Сана оралиғи'];
  var k=['hammasi','oy','kecha','kun','oraliq'].indexOf(S.oraliq);
  var davr=d[k<0?0:k];

  var sanalar=l.map(function(x){ return x.sana }).filter(Boolean).sort();
  var oraliq = sanalar.length
    ? dfmt(sanalar[0])+' — '+dfmt(sanalar[sanalar.length-1])
    : '—';

  var q=[
    ['Давр', davr],
    ['Сана оралиғи', oraliq],
    ['Валюта', S.valyuta==='USD'?'AQSH доллари':'TJS (сомони)'],
    ['Ёзувлар', fmt(l.length)+' та']
  ];
  if(S.kassa && S.kassa!=='hammasi') q.push(['Касса', S.kassa]);

  return '<div class="fizoh"><div class="eb">Ҳозир нима кўрсатилмоқда</div><div class="fq">'+
    q.map(function(x){
      return '<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>';
    }).join('')+'</div>'+
    '<p>Юқоридаги барча рақамлар шу шартларга мос ёзувлардан ҳисобланган. '+
    'Бошқа давр керак бўлса, тепадаги сана тугмаларини ўзгартиринг.</p></div>';
}

/** Молия учун Кун / Ҳафта / Ой тугмалари — хулосада энг катта кирим кўрсатилади */
function mDavrQatori(l){
  function b(k,t){ return '<button data-davr="'+k+'" class="'+(S.davr===k?'on':'')+'">'+t+'</button>' }
  var m={},eng=null;
  l.forEach(function(x){
    if(x.tip!=='kirim') return;
    var k=davrKalit(x.sana); if(!k) return;
    m[k]=(m[k]||0)+x.summa;
    if(!eng||m[k]>m[eng]) eng=k;
  });
  var oz = eng ? 'Энг катта кирим: '+davrYorliq(eng)+' \u2014 '+mqisqa(m[eng]) : '';
  return '<div class="davrq"><div class="seg">'+b('kun','Кун')+b('hafta','Ҳафта')+b('oy','Ой')+'</div>'+
    '<div class="oz">'+esc(oz)+'</div></div>';
}

/** Кирим/чиқим динамикаси — ёнма-ён иккита устун */
function mDinamika(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=davrKalit(x.sana); if(!k) return;
    if(!m[k]){ m[k]={kirim:0,chiqim:0}; t.push(k) }
    m[k][x.tip]+=x.summa;
  });
  t.sort();
  if(!t.length) return bosh('Бу даврда ёзув йўқ');

  var slot = S.davr==='kun' ? 28 : 56;
  var chap = 68, ong = 26, tep = 30, past = 54;
  var bor = Math.max(320, (main.clientWidth||960) - 74);
  var W = Math.max(bor, chap+ong+slot*(t.length-1)), H = 252;
  var max = 1;
  t.forEach(function(k){ max=Math.max(max,m[k].kirim,m[k].chiqim) });

  var X=function(i){ return chap+(W-chap-ong)*(t.length===1?0:i/(t.length-1)) };
  var Y=function(v){ return tep+(H-tep-past)*(1-v/max) };

  var tor='';
  [0,.5,1].forEach(function(f){
    var y=(tep+(H-tep-past)*(1-f)).toFixed(1);
    tor+='<line class="gl" x1="'+chap+'" y1="'+y+'" x2="'+(W-ong)+'" y2="'+y+'"/>'+
         '<text x="0" y="'+(+y+3)+'">'+mqisqa(max*f)+'</text>';
  });

  var id=Math.floor(Math.random()*1e6);
  var qatlam='';
  [['kirim','var(--ok)','k'+id],['chiqim','var(--no)','c'+id]].forEach(function(p,qi){
    var nuq=t.map(function(k,i){ return [X(i),Y(m[k][p[0]])] });
    var yol=egri(nuq);
    qatlam+='<path class="aarea" d="'+yol+'L'+X(t.length-1).toFixed(1)+' '+(H-past)+
      'L'+X(0).toFixed(1)+' '+(H-past)+'Z" fill="url(#'+p[2]+')" '+
      'style="animation-delay:'+(0.45+qi*0.12).toFixed(2)+'s"/>'+
      '<path class="aline" d="'+yol+'" fill="none" stroke="'+p[1]+'" stroke-width="2.4" '+
      'stroke-linecap="round" stroke-linejoin="round" '+
      'style="animation-delay:'+(0.1+qi*0.18).toFixed(2)+'s"/>';
  });

  var qadam=Math.max(1,Math.ceil(t.length/12));
  var yorliq='',belgi='';
  t.forEach(function(k,i){
    var x=X(i);
    if(t.length<=30 || i%qadam===0 || i===t.length-1){
      yorliq+='<text transform="rotate(-90 '+x.toFixed(1)+' '+(H-past+12)+')" x="'+x.toFixed(1)+
        '" y="'+(H-past+12)+'" text-anchor="end">'+davrYorliq(k)+'</text>';
      belgi+='<circle class="apt" cx="'+x.toFixed(1)+'" cy="'+Y(m[k].kirim).toFixed(1)+
        '" r="3" fill="var(--ok)" style="animation-delay:'+(0.55+i*0.012).toFixed(2)+'s">'+
        '<title>'+davrYorliq(k)+' · кирим '+mpul(m[k].kirim)+'</title></circle>'+
        '<circle class="apt" cx="'+x.toFixed(1)+'" cy="'+Y(m[k].chiqim).toFixed(1)+
        '" r="3" fill="var(--no)" style="animation-delay:'+(0.6+i*0.012).toFixed(2)+'s">'+
        '<title>'+davrYorliq(k)+' · чиқим '+mpul(m[k].chiqim)+'</title></circle>';
    }
  });

  return '<div class="dwrap"><svg class="dch" width="'+W+'" height="'+H+'" '+
    'viewBox="0 0 '+W+' '+H+'" style="max-width:100%">'+
    '<defs>'+
      '<linearGradient id="k'+id+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" style="stop-color:var(--ok);stop-opacity:.40"/>'+
        '<stop offset="100%" style="stop-color:var(--ok);stop-opacity:0"/></linearGradient>'+
      '<linearGradient id="c'+id+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" style="stop-color:var(--no);stop-opacity:.36"/>'+
        '<stop offset="100%" style="stop-color:var(--no);stop-opacity:0"/></linearGradient>'+
    '</defs>'+tor+qatlam+belgi+yorliq+'</svg></div>'+
    '<div class="mlg"><span><i class="mkirb"></i>кирим</span><span><i class="mchib"></i>чиқим</span></div>'+
    (W>bor+4 ? '<div class="surish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
      '<path d="M5 12h14M12 5l7 7-7 7"/></svg>Барча саналарни кўриш учун чапга суринг</div>' : '');
}


/** Сумма бўйича горизонтал устунлар */
function mUstunlar(l,rangi){
  if(!l.length) return bosh('Бу даврда маълумот йўқ');
  var jami=l.reduce(function(s,x){ return s+x.summa },0);
  var max=l[0].summa||1;
  return '<div class="bl">'+l.map(function(x,i){
    return '<div class="bi">'+
      '<div class="bn">'+esc(x.nom)+'<small>'+x.soni+' та ёзув · '+foiz(x.summa,jami)+'%</small></div>'+
      '<div class="btr"><div class="bfl" style="width:'+Math.max(1.5,x.summa/max*100)+
        '%;background:'+(rangi||rang(i))+'"></div></div>'+
      '<div class="bv">'+mqisqa(x.summa)+'</div></div>';
  }).join('')+'</div>';
}

/** Ёзув остида очиладиган изоҳ қутиси (босилганда кўринади) */
function mIzohQuti(x){
  var q=[['Сана',dfmt(x.sana)],['Касса',x.kassa],['Асосий стадия',x.asosiy],
         ['Стадия',x.stadiya],['Кичик стадия',x.kichik],
         ['Сумма',(x.tip==='kirim'?'+':'−')+fmt(x.summa)+(x.valyuta==='USD'?' $':' TJS')]]
        .filter(function(r){ return r[1] });
  return '<div class="mizq">'+
    '<div class="mizt">'+(x.izoh?esc(x.izoh):'<span class="mizyoq">Бу ёзувга изоҳ ёзилмаган</span>')+'</div>'+
    '<div class="mizm">'+q.map(function(r){ return '<span>'+esc(r[0])+': <b>'+esc(r[1])+'</b></span>' }).join('')+'</div>'+
  '</div>';
}

/** Сана бўйича гуруҳланган молия ёзувлари */
function mRoyxat(l){
  if(!l.length) return '<div class="empty">Ёзув йўқ</div>';
  var s=l.slice().sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) }).slice(0,200);
  var g={},t=[];
  s.forEach(function(x){
    var k=dfmt(x.sana);
    if(!g[k]){ g[k]=[]; t.push(k) }
    g[k].push(x);
  });
  return '<div class="jlist">'+t.map(function(k){
    var lst=g[k],kir=0,chi=0;
    lst.forEach(function(x){ if(x.tip==='kirim') kir+=x.summa; else chi+=x.summa });
    var yozuv=[];
    if(kir) yozuv.push('<span style="color:var(--green)">+'+mqisqa(kir)+'</span>');
    if(chi) yozuv.push('<span style="color:var(--red)">−'+mqisqa(chi)+'</span>');
    return '<div class="jkun"><div class="jsar"><b>'+k+'</b><span>'+yozuv.join(' · ')+'</span></div>'+
      lst.map(function(x){
        var kir2=x.tip==='kirim';
        return '<div class="jkart mizk'+(x.izoh?' bor':'')+'" data-miz><div class="jchap">'+
          '<div class="jnom">'+esc(x.stadiya||x.asosiy||'—')+(x.izoh?'<i class="mizi" title="Изоҳ бор"></i>':'')+'</div>'+
          '<div class="jmeta">'+esc([x.asosiy,x.kichik].filter(Boolean).join(' · '))+'</div></div>'+
          '<div class="jong"><div class="jmiq" style="color:'+(kir2?'var(--green)':'var(--red)')+'">'+
            (kir2?'+':'−')+mqisqa(x.summa)+'</div>'+
          '<div class="jxod">'+esc(x.kassa||'')+'</div></div>'+
          mIzohQuti(x)+'</div>';
      }).join('')+'</div>';
  }).join('')+'</div>';
}


/* ── МОЛИЯ, БЎЛИМ 1: УМУМИЙ ── */

function moliyaUmumiy(){
  var bosh=mBoshHolat();
  var h=sarlavha('Финанс — умумий','Кирим, чиқим ва фарқ',
    valyutaSeg()+sanaFiltr()+mobilTugma());
  if(bosh) return h+bosh;

  var l=mSatrlar(), j=mJam(l);
  var kassa=mGuruh(l,function(x){ return x.kassa });
  var kir=mGuruh(l.filter(function(x){return x.tip==='kirim'}),function(x){ return x.asosiy });
  var chi=mGuruh(l.filter(function(x){return x.tip==='chiqim'}),function(x){ return x.asosiy });

  h+='<div class="mets">'+
    '<div class="met k"><div class="met-l">Кирим</div><div class="met-v num">'+mqisqa(j.kirim)+'</div>'+
      '<div class="met-d">'+mpul(j.kirim)+'</div></div>'+
    '<div class="met c"><div class="met-l">Чиқим</div><div class="met-v num">'+mqisqa(j.chiqim)+'</div>'+
      '<div class="met-d">'+mpul(j.chiqim)+'</div></div>'+
    '<div class="met '+(j.farq>=0?'k':'c')+'"><div class="met-l">Фарқ</div>'+
      '<div class="met-v num">'+mqisqa(j.farq)+'</div>'+
      '<div class="met-d">'+mqisqa(j.kirim)+' − '+mqisqa(j.chiqim)+'</div></div>'+
    '<div class="met"><div class="met-l">Ёзувлар</div><div class="met-v num">'+fmt(j.soni)+'</div>'+
      '<div class="met-d">танланган даврда</div></div>'+
  '</div>';

  h+=bolim('Кассадаги қолдиқ','Ҳозир ҳар бир кассада қанча пул бор — кирим минус чиқим',
    mKassaBlok(l));

  h+=bolim('Кирим ва чиқим динамикаси','Яшил — кирим, қизил — чиқим',
    mDavrQatori(l)+mDinamika(l));

  // ── Кирим ва чиқим тузилиши: доира диаграмма + фоизлар ──
  h+='<div class="two" style="margin-top:16px">'+
     '<div><div class="sec" style="margin-top:0"><h2>Кирим тузилиши</h2>'+
       '<p>Асосий стадия бўйича · жами '+mpul(j.kirim)+'</p></div>'+
     '<div class="panel">'+mDoira(kir,'var(--green)')+'</div></div>'+
     '<div><div class="sec" style="margin-top:0"><h2>Чиқим тузилиши</h2>'+
       '<p>Асосий стадия бўйича · жами '+mpul(j.chiqim)+'</p></div>'+
     '<div class="panel">'+mDoira(chi,'var(--red)')+'</div></div></div>';

  // ── Энг йирик моддалар (2-даража) ──
  h+='<div class="two" style="margin-top:16px">'+
     '<div><div class="sec" style="margin-top:0"><h2>Энг йирик кирим моддалари</h2>'+
       '<p>Стадия кесимида, юқори 8 таси</p></div>'+
     '<div class="panel">'+mTopModda(l,'kirim','var(--green)')+'</div></div>'+
     '<div><div class="sec" style="margin-top:0"><h2>Энг йирик чиқим моддалари</h2>'+
       '<p>Стадия кесимида, юқори 8 таси</p></div>'+
     '<div class="panel">'+mTopModda(l,'chiqim','var(--red)')+'</div></div></div>';

  // ── Саҳифа таги: ҳозир нима кўрсатилаётгани ──
  h+=filtrIzoh(l);
  return h;
}


/* ── МОЛИЯ, БЎЛИМ 2 ва 3: КИРИМ / ЧИҚИМ ── */

function moliyaYonalish(yon){
  var kirimMi=(yon==='kirim');
  var bosh=mBoshHolat();
  var h=sarlavha(kirimMi?'Кирим':'Чиқим',
    kirimMi?'Пул қаердан келди — батафсил учун босинг':'Пул қаерга кетди — батафсил учун босинг',
    valyutaSeg()+sanaFiltr()+mobilTugma());
  if(bosh) return h+bosh;

  var l=mSatrlar().filter(function(x){ return x.tip===yon });
  var guruh=mGuruh(l,function(x){ return x.asosiy });
  var jami=guruh.reduce(function(s,x){ return s+x.summa },0);
  var max=guruh.length?guruh[0].summa:1;
  var asosRang=kirimMi?'var(--green)':'var(--red)';
  var ochiq=null;
  guruh.forEach(function(x){ if(x.nom===S.ochiq) ochiq=x });

  h+='<div class="mets" style="grid-template-columns:repeat(2,1fr);max-width:520px">'+
    '<div class="met '+(kirimMi?'k':'c')+'"><div class="met-l">Жами</div>'+
      '<div class="met-v num">'+mqisqa(jami)+'</div><div class="met-d">'+mpul(jami)+'</div></div>'+
    '<div class="met"><div class="met-l">Ёзувлар</div><div class="met-v num">'+fmt(l.length)+'</div>'+
      '<div class="met-d">'+guruh.length+' та йўналиш</div></div></div>';

  h+='<div class="sec"><h2>Тақсимот</h2><p>Асосий стадия бўйича улуш</p></div>'+
     '<div class="panel">'+mDoira(guruh,asosRang)+'</div>';

  h+='<div class="sec"><h2>Асосий стадия</h2><p>Батафсил учун картани босинг</p></div>';
  h+='<div class="grid">'+(guruh.length?guruh.map(function(x,i){
    return '<button class="card '+(S.ochiq===x.nom?'sel':'')+'" data-mkes="'+esc(x.nom)+'">'+
      '<div class="cn">'+esc(x.nom)+'</div>'+
      '<div class="cm">'+foiz(x.summa,jami)+'% · '+x.soni+' та ёзув</div>'+
      '<div class="cq"><b class="num">'+mqisqa(x.summa)+'</b></div>'+
      '<div class="cbar"><i style="width:'+Math.max(3,x.summa/max*100)+'%;background:'+rang(i)+'"></i></div>'+
    '</button>';
  }).join(''):bosh('Маълумот йўқ'))+'</div>';

  if(ochiq){
    var st=mGuruh(ochiq.satrlar,function(x){ return x.stadiya });
    var ki=mGuruh(ochiq.satrlar.filter(function(x){ return x.kichik }),function(x){ return x.kichik });
    var ka=mGuruh(ochiq.satrlar,function(x){ return x.kassa });
    h+='<div class="detail">'+
      '<div class="dh"><div class="dm"><h3>'+esc(ochiq.nom)+'</h3>'+
        '<div class="sub">'+(kirimMi?'Кирим':'Чиқим')+' · '+foiz(ochiq.summa,jami)+'% улуш</div>'+
        '<div class="chips">'+
          '<span class="chip '+(kirimMi?'k':'c')+'">Жами <b>'+mpul(ochiq.summa)+'</b></span>'+
          '<span class="chip">Ёзувлар: <b>'+fmt(ochiq.soni)+'</b></span>'+
          '<span class="chip">Ўртача: <b>'+mqisqa(ochiq.summa/ochiq.soni)+'</b></span>'+
        '</div></div>'+
        '<button class="btn" data-yop>Ёпиш</button></div>'+
      '<div class="dbody"><div class="eb">Стадия бўйича</div>'+mUstunlar(st,asosRang)+'</div>'+
      (ki.length?'<div class="dbody"><div class="eb">Кичик стадия бўйича</div>'+mUstunlar(ki)+'</div>':'')+
      (ka.length>1?'<div class="dbody"><div class="eb">Касса бўйича</div>'+mUstunlar(ka)+'</div>':'')+
      '<div class="dbody"><div class="eb">Ёзувлар</div>'+mRoyxat(ochiq.satrlar)+'</div>'+
    '</div>';
  }
  return h;
}


/* ── МОЛИЯ, БЎЛИМ 4: ЁЗУВЛАР ── */

function moliyaJurnal(){
  var bosh=mBoshHolat();
  var h=sarlavha('Ёзувлар','Финанс жадвалидаги ёзувлар',
    '<input type="text" id="qid" placeholder="Стадия, касса, изоҳ…" value="'+esc(S.qidiruv)+'" style="width:190px">'+
    valyutaSeg()+sanaFiltr()+mobilTugma());
  if(bosh) return h+bosh;

  var l=mSatrlar();

  }
  l=l.sort(function(a,b){ return (sanaOqi(b.sana)||0)-(sanaOqi(a.sana)||0) });

  h+='<div class="mets" style="grid-template-columns:repeat(3,1fr)">'+

    '<div class="met k"><div class="met-l">Кирим</div><div class="met-v num">'+mqisqa(j.kirim)+'</div>'+
      '<div class="met-d">'+mpul(j.kirim)+'</div></div>'+
    '<div class="met c"><div class="met-l">Чиқим</div><div class="met-v num">'+mqisqa(j.chiqim)+'</div>'+
      '<div class="met-d">'+mpul(j.chiqim)+'</div></div></div>';

  h+='<div class="tw"><div class="tscroll"><table class="tbl"><thead><tr>'+
    '<th>Сана</th><th>Касса</th><th>ТиП</th><th>Асосий стадия</th><th>Стадия</th>'+
    '<th>Кичик стадия</th><th style="text-align:right">Сумма</th><th>Изоҳ <span style="text-transform:none;letter-spacing:0;font-weight:500">· очиш учун қаторни босинг</span></th></tr></thead><tbody>'+
    (kes.length?kes.map(function(x){
      var kir=x.tip==='kirim';
      return '<tr class="mizr'+(x.izoh?' bor':'')+'" data-miz><td class="num" style="color:var(--muted)">'+dfmt(x.sana)+'</td>'+
        '<td>'+esc(x.kassa||'—')+'</td>'+
        '<td><span class="pill '+(kir?'':'kel')+'">'+(kir?'Кирим':'Чиқим')+'</span></td>'+
        '<td style="font-weight:500">'+esc(x.asosiy||'—')+'</td>'+
        '<td>'+esc(x.stadiya||'—')+'</td>'+
        '<td style="color:var(--muted)">'+esc(x.kichik||'—')+'</td>'+
        '<td class="num" style="text-align:right;font-weight:600;color:'+(kir?'var(--green)':'var(--red)')+'">'+
          (kir?'+':'−')+fmt(x.summa)+'</td>'+
        '<td class="mizc">'+(x.izoh?'<span class="mizqs">'+esc(x.izoh)+'</span>':'<span style="opacity:.45">—</span>')+
          '<i class="mizo"></i></td></tr>'+
        '<tr class="mizd"><td colspan="8">'+mIzohQuti(x)+'</td></tr>';
    }).join(''):'<tr><td colspan="8" style="padding:26px;text-align:center;color:var(--muted)">Ёзув топилмади</td></tr>')+
    '</tbody></table></div></div>'+
    '<div class="jfaqat">'+mRoyxat(l)+'</div>'+
    (l.length>200?'<div class="sub" style="margin-top:10px">Охирги 200 таси кўрсатилди (жами '+fmt(l.length)+')</div>':'');
  return h;
}

/* ══════════════════════════════════════════════════════
   15. МАРКЕТИНГ
   «Лидлар қаердан келди ва нечтаси сотувга айланди?»
   ══════════════════════════════════════════════════════ */

function markMi(){ return S.prod==='marketing' || !!K_VARAQ[S.prod] }
/* Турон Форум маркетинги — ўша саҳифалар, фақат маълумот манбаи бошқа
   («Marketing RBA 15» жадвалидаги «Турон форум» варағи) */
/* Қўшимча маркетинг варақлари: бўлим коди → варақ (?varaq=…) ва D ичидаги жойи */
var K_VARAQ={
  forum_mark:  {v:'forum', d:'fMark', nom:'Турон форум', pre:'Турон Форум · ', re:/турон|форум/i},
  yashil_mark: {v:'uy',    d:'uMark', nom:'Уй',          pre:'Яшил Макон · ',  re:/^\s*уй/i}
};
function kV(){ return K_VARAQ[S.prod]||null }
function kFor(){ return !!kV() }
function kD(){ var v=kV(); return D ? (v?D[v.d]:D.marketing) : null }
function kT(){ var v=kV(); return D ? (v?D[v.d+'Tashxis']:D.markTashxis) : null }
function kX(){ var v=kV(); return D ? (v?D[v.d+'Xato']:D.markXato) : null }

var MK_NOM={yangi:'Янги лид',sifatsiz:'Сифатсиз',sotuv:'Сотув',obrabotka:'Обработкада'};
var MK_RANG={yangi:'var(--info)',sifatsiz:'var(--no)',sotuv:'var(--ok)',obrabotka:'var(--a)'};

/** Сана ва таргетолог фильтридан ўтган лидлар */
function kSatrlar(barchaTarget){
  if(!D || !kD()) return [];
  var l=sanaFiltrla(kD());
  if(!barchaTarget && S.target!=='hammasi')
    l=l.filter(function(x){ return x.target===S.target });
  return l;
}

function kJam(l){
  var o={jami:l.length,yangi:0,sifatsiz:0,sotuv:0,obrabotka:0};
  l.forEach(function(x){ o[x.holat]++ });
  return kKonvHisob(o);
}

/**
 * ИККИ ХИЛ КОНВЕРСИЯ
 *  Сифатсиз лид = «База» + «Сделка провалена» (не качество) + «Кўтармади» + «Бизнеси йўқ»
 *  Сифатли лид  = жами − сифатсиз
 *  Маркетинг конверсия = сотув ÷ ишланган лид (сифатсиз ва янги лид ҳисобга кирмайди)
 *  Сотув конверсия     = сотув ÷ жами лид      (ҳамма лидга нисбатан)
 *  Сифатсиз улуши      = сифатсиз ÷ жами
 */
function kKonvHisob(o){
  o.musr=o.sifatsiz;
  o.sifatli=Math.max(0,o.jami-o.musr);
  o.hisob=o.obrabotka+o.sotuv;                  // ишланган лид: сифатсиз ва янги лидсиз
  o.mkonv=o.hisob?o.sotuv/o.hisob*100:0;        // маркетинг: сифатсиз ва янги ҳисобга кирмайди
  o.skonv=o.jami?o.sotuv/o.jami*100:0;          // сотув: ҳамма лиддан
  o.sfoiz=o.jami?o.musr/o.jami*100:0;           // сифатсиз улуши
  o.konv=o.jami?o.sotuv/o.jami*100:0;
  return o;
}

function kFoiz(f){ return (f>=10?Math.round(f):f.toFixed(1))+'%' }

/** Соцсетлар — Marketing.gs «Название» устунидан таргетолог қаторига қўшади (YouTube, Telegram, Facebook, TikTok…) */
var K_SOT={youtube:'▶',telegram:'✈',facebook:'f',tiktok:'♪',instagram:'◎'};
function kSotMi(nom){ return K_SOT[String(nom||'').toLowerCase().replace(/\s/g,'')]||'' }
function kSotTeg(nom){ var b=kSotMi(nom); return b?'<small class="ksot" title="Соцсет — лид номидан аниқланган"><i>'+b+'</i>соцсет</small>':'' }
/** Таргетологлар кесими — конверсия бўйича */
function kTargetlar(l){
  var m={},t=[];
  l.forEach(function(x){
    var k=x.target||'—';
    if(!m[k]){ m[k]={nom:k,jami:0,yangi:0,sifatsiz:0,sotuv:0,obrabotka:0,satrlar:[]}; t.push(k) }
    m[k].jami++; m[k][x.holat]++; m[k].satrlar.push(x);
  });
  return t.map(function(k){ return kKonvHisob(m[k]) })
          .sort(function(a,b){ return b.jami-a.jami });
}

function kBoshHolat(){
  if(!(kD()&&kD().length) && (kBandMi() || (markUlangan() && D && !kD() && !kX())))   // маълумот бор бўлса — янгиланаётганда ҳам кўрсатилади
    return '<div class="load"><div class="spin"></div>Маркетинг маълумоти юкланмоқда…</div>';
  if(!markUlangan())
    return '<div class="empty"><b>Маркетинг уланмаган</b>HTML файлдаги <b>API_MARKETING</b> га '+
           'Marketing.gs дан чиққан ҳаволани қўйинг.</div>';
  if(D && kX()){
    // Хато сабабини тушунтирамиз ва қайта уриниш тугмаси
    var x=String(kX()||''), izoh='';
    if(/failed to fetch|networkerror|load failed/i.test(x)) izoh='Интернет узилди ёки Apps Script деплойида «Доступ: Все» қилинмаган.';
    else if(/unexpected token|not valid json|json/i.test(x)) izoh='Ҳавола JSON эмас, HTML қайтаряпти — деплой «Новая версия» қилинмаган ёки лойиҳада бошқа doGet бор.';
    else if(/эски версия/i.test(x)) izoh='Marketing.gs ни янги версияга кўтариб, «Управление развертываниями → ✏ → Новая версия» қилинг.';
    else if(/illegal spreadsheet|spreadsheet id|not found|openById|JADVAL_ID/i.test(x)) izoh='Скриптдаги JADVAL_ID нотўғри — жадвал ҳаволасини браузердан нусха олиб, тўлиқ қўйинг ва «Новая версия» қилинг.';
    else if(/варағи топилмади/i.test(x)) izoh='Жадвалда шу номли варақ йўқ — номини текширинг (скриптдаги VARAQ рўйхатига қўшиш мумкин).';
    else if(/устун топилмади/i.test(x)) izoh='Варақнинг сарлавҳа қаторида керакли устун йўқ («Дата начала», «Стадия сделки»).';
    else if(/exceeded|timeout|time out|вақт/i.test(x)) izoh='Сервер жуда узоқ ишлади — бир оздан кейин қайта уриниб кўринг.';
    var eski=kD()&&kD().length;
    var blok='<div class="xato"><b>Маркетинг серверига уланиб бўлмади</b>'+esc(x)+
      (izoh?'<div style="margin-top:8px;font-size:12.5px;color:var(--ink2)">'+izoh+'</div>':'')+
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
        '<button class="btn btn-o" data-kqayta>Қайта уриниш</button>'+
        (eski?'<span style="font-size:12px;color:var(--muted)">Пастда охирги муваффақиятли юкланган маълумот кўрсатилмоқда</span>':'')+
      '</div></div>';
    if(!eski) return blok;
    return {eski:blok};                                   // эски маълумот бор — саҳифа чизилади, тепада огоҳлантириш
  }
  if(!kD() || !kD().length) return kTashxis();
  return '';
}

function kTashxis(){
  var t=kT();
  if(!t) return '<div class="tsh"><h3>Лид ўқилмади</h3>'+
    '<p>Сервер ташхис юбормади — эски версия ишлаяпти.</p>'+
    '<div class="tshq">Apps Script → Deploy → Manage deployments → ✏ → '+
    'Version: <b>New version</b> → Deploy</div></div>';
  return '<div class="tsh"><h3>Лид ўқилмади</h3><table class="tshj">'+
    '<tr><td>Скрипт версияси</td><td><b>'+esc(t.versiya||'?')+'</b></td></tr>'+
    '<tr><td>Ўқилган варақ</td><td><b>«'+esc(t.varaq)+'»</b></td></tr>'+
    '<tr><td>Варақдаги қаторлар</td><td><b>'+fmt(t.jamiQator)+'</b></td></tr>'+
    '<tr><td>Сана йўқ</td><td><b>'+fmt(t.sanasiz||0)+'</b></td></tr>'+
    '<tr><td>Ўқилди</td><td><b>'+fmt(t.oqilgan)+'</b></td></tr></table></div>';
}

/** Таргетолог танлаш тугмалари */
function kTargetSeg(){
  var l=kTargetlar(sanaFiltrla(kD()||[]));
  var h='<div class="seg ksg"><button data-tg="hammasi" class="'+(S.target==='hammasi'?'on':'')+'">Ҳаммаси</button>';
  l.forEach(function(x){
    h+='<button data-tg="'+esc(x.nom)+'" class="'+(S.target===x.nom?'on':'')+'">'+(kSotMi(x.nom)?'<i class="ksoti">'+kSotMi(x.nom)+'</i>':'')+esc(x.nom)+'</button>';
  });
  return h+'</div>';
}

/** Ҳолат бўйича тақсимот — тўртта рангли полоса */
function kHolatChiziq(j){
  if(!j.jami) return '';
  var q=['sotuv','obrabotka','yangi','sifatsiz'];
  return '<div class="kchiz">'+q.map(function(k){
    var f=j[k]/j.jami*100;
    return f<=0?'':'<i style="width:'+f+'%;background:'+MK_RANG[k]+'" title="'+MK_NOM[k]+': '+j[k]+'"></i>';
  }).join('')+'</div>'+
  '<div class="klg">'+q.map(function(k){
    return '<span><i style="background:'+MK_RANG[k]+'"></i>'+MK_NOM[k]+
      ' <b>'+fmt(j[k])+'</b> · '+kFoiz(j.jami?j[k]/j.jami*100:0)+'</span>';
  }).join('')+'</div>';
}


/* ── 15.1 УМУМИЙ ─────────────────────────────────────── */

function markUmumiy(){
  var h=sarlavha('Маркетинг — умумий','Лидлар, сифати ва конверсияси',
    sanaFiltr()+mobilTugma());
  var b=kBoshHolat();
  if(b && b.eski){ h+=b.eski; b='' }           // хато, лекин эски маълумот бор — огоҳлантириб давом этамиз
  if(b) return h+b;

  var barcha=sanaFiltrla(kD());
  var l=kSatrlar();
  var j=kJam(l);
  var tg=kTargetlar(barcha);

  h+='<div class="mets">'+
    '<div class="met"><div class="met-l">Жами лид</div><div class="met-v num">'+fmt(j.jami)+'</div>'+
      '<div class="met-d">обработкада '+fmt(j.obrabotka)+' · янги '+fmt(j.yangi)+'</div></div>'+
    '<div class="met c"><div class="met-l">Сифатсиз лид</div><div class="met-v num">'+fmt(j.musr)+'</div>'+
      '<div class="met-d">'+kFoiz(j.jami?j.musr/j.jami*100:0)+' · база, не качество, кўтармади, бизнеси йўқ</div></div>'+
    '<div class="met" style="--mc:var(--info)"><div class="met-l">Маркетинг конверсия</div><div class="met-v num" style="color:var(--info)">'+kFoiz(j.mkonv)+'</div>'+
      '<div class="met-d">'+fmt(j.sotuv)+' сотув ÷ '+fmt(j.hisob)+' ишланган лид (сифатсиз ва янгисиз)</div></div>'+
    '<div class="met k"><div class="met-l">Сотув конверсия</div><div class="met-v num">'+kFoiz(j.skonv)+'</div>'+
      '<div class="met-d">'+fmt(j.sotuv)+' сотув ÷ '+fmt(j.jami)+' жами лид</div></div>'+
  '</div>';

  h+=bolim('Лид сифати','Барча лидлар қандай тақсимланган',kHolatChiziq(j));

  h+='<div class="sec"><h2>Таргетологлар</h2><p>Маркетинг конверсия — ишланган лиддан, сотув конверсия — ҳамма лиддан</p></div>'+
     '<div class="kvtg">'+tg.map(kTargetKonvKarta).join('')+'</div>'+
     '<div style="margin-top:10px"><button class="btn btn-o" data-konvga>Воронка ва батафсил конверсия →</button></div>';

  h+=bolim('Кунлик лидлар','Ҳар бир санада нечта лид тушган',
    davrQatori(l)+dinamika(l));

  var st=kGuruh(l,function(x){ return x.stadiya||'—' }).slice(0,10);
  h+=bolim('Энг кўп стадиялар','Юқори 10 таси',
    mUstunlar(st.map(function(x){ return {nom:x.nom,summa:x.soni,soni:x.soni} })));

  h+=kFiltrIzoh(l,j);
  return h;
}

/** Маркетинг учун гуруҳлаш (сон бўйича) */
function kGuruh(l,ol){
  var m={},t=[];
  l.forEach(function(x){
    var k=ol(x)||'—';
    if(!m[k]){ m[k]={nom:k,soni:0,sotuv:0,sifatsiz:0,obrabotka:0,yangi:0,satrlar:[]}; t.push(k) }
    m[k].soni++; m[k][x.holat]++; m[k].satrlar.push(x);
  });
  return t.map(function(k){ return m[k] }).sort(function(a,b){ return b.soni-a.soni });
}


/* ── 15.2 ТАРГЕТОЛОГЛАР ──────────────────────────────── */

    '</button>';
  }).join('')+'</div>';

  if(ochiq){
