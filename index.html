    var mb=kGuruh(ochiq.satrlar,function(x){ return x.manba||'—' }).slice(0,8);
    h+='<div class="detail"><div class="dh"><div class="dm"><h3>'+esc(ochiq.nom)+'</h3>'+
      '<div class="sub">маркетинг конверсия <b style="color:var(--info)">'+kFoiz(ochiq.mkonv)+'</b> · '+
        'сотув конверсия <b style="color:var(--ok)">'+kFoiz(ochiq.skonv)+'</b> · сифатсиз '+kFoiz(ochiq.sfoiz)+'</div>'+
      '<div class="chips">'+
        '<span class="chip">Жами: <b>'+fmt(ochiq.jami)+'</b></span>'+
        '<span class="chip c">Сифатсиз <b>'+fmt(ochiq.musr)+'</b></span>'+
        '<span class="chip">Сифатли <b>'+fmt(ochiq.sifatli)+'</b></span>'+
        '<span class="chip">Обработка <b>'+fmt(ochiq.obrabotka)+'</b></span>'+
        '<span class="chip k">Сотув <b>'+fmt(ochiq.sotuv)+'</b></span>'+
      '</div></div><button class="btn" data-yop>Ёпиш</button></div>'+
      '<div class="dbody"><div class="two">'+
        '<div><div class="eb">Маркетинг воронкаси</div>'+kMarkVoronka(ochiq.satrlar,kJam(ochiq.satrlar))+'</div>'+
        '<div><div class="eb">Сотув воронкаси</div>'+kSotuvVoronka(kJam(ochiq.satrlar),ochiq.satrlar)+'</div>'+
      '</div></div>'+
      '<div class="dbody"><div class="eb">Лид сифати</div>'+kHolatChiziq(kJam(ochiq.satrlar))+'</div>'+
      '<div class="dbody"><div class="eb">Стадиялар бўйича</div>'+
        mUstunlar(st.map(function(x){ return {nom:x.nom,summa:x.soni,soni:x.soni} }))+'</div>'+
      '<div class="dbody"><div class="eb">Манбалар бўйича</div>'+
        mUstunlar(mb.map(function(x){ return {nom:x.nom,summa:x.soni,soni:x.soni} }))+'</div>'+
      '<div class="dbody"><div class="eb">Кунлик динамика</div>'+dinamika(ochiq.satrlar)+'</div></div>';
  }

  h+='<div class="sec"><h2>Таққослаш</h2><p>Иккала конверсия алоҳида</p></div>'+
     '<div class="kvtg">'+tg.slice().sort(function(a,b){ return b.skonv-a.skonv }).map(kTargetKonvKarta).join('')+'</div>';
  return h;
}


/* ── 15.3 СТАДИЯЛАР ──────────────────────────────────── */

function markStadiya(){
  var h=sarlavha('Стадиялар','Лидлар қайси босқичда турибди',
    sanaFiltr()+mobilTugma());
  var b=kBoshHolat();
  if(b && b.eski){ h+=b.eski; b='' }           // хато, лекин эски маълумот бор — огоҳлантириб давом этамиз
  if(b) return h+b;

  var l=kSatrlar();
  var j=kJam(l);
  h+=kTargetSeg();
  h+='<div class="mets" style="margin-top:14px">'+
    ['sotuv','obrabotka','yangi','sifatsiz'].map(function(k){
      var kl=k==='sotuv'?' k':(k==='sifatsiz'?' c':(k==='obrabotka'?' o':''));
      return '<div class="met'+kl+'"><div class="met-l">'+MK_NOM[k]+'</div>'+
        '<div class="met-v num">'+fmt(j[k])+'</div>'+
        '<div class="met-d">'+kFoiz(j.jami?j[k]/j.jami*100:0)+'</div></div>';
    }).join('')+'</div>';

  var guruh=[
    ['sotuv','Сотув бўлган стадиялар'],
    ['obrabotka','Обработкадаги стадиялар'],
    ['sifatsiz','Сифатсиз стадиялар'],
    ['yangi','Янги лид стадиялари']
  ];
  guruh.forEach(function(g){
    var lst=kGuruh(l.filter(function(x){ return x.holat===g[0] }),
                   function(x){ return x.stadiya||'—' });
    if(!lst.length) return;
    var jm=0; lst.forEach(function(x){ jm+=x.soni });
    h+='<div class="sec"><h2>'+g[1]+'</h2><p>жами '+fmt(jm)+' та лид</p></div><div class="panel">'+
       mUstunlar(lst.map(function(x){ return {nom:x.nom,summa:x.soni,soni:x.soni} }),MK_RANG[g[0]])+
       '</div>';
  });

  h+=kFiltrIzoh(l,j);
  return h;
}


/* ── 15.5 КОНВЕРСИЯ ──────────────────────────────────────
   Сифатсиз лид = «База», «Сделка провалена» (не качество),
                  «Кўтармади», «Бизнеси йўқ» стадиялари
   Сифатли лид  = жами − сифатсиз
   Маркетинг конверсия = сотув ÷ ишланган лид (сифатсиз ва янги лид ҳисобга кирмайди)
   Сотув конверсия     = сотув ÷ ҳамма лид
   ─────────────────────────────────────────────────────── */

/** «Кўтармади» стадияси сервердан «обработка» бўлиб келади — уни сифатсизга ўтказамиз */
var K_KOTARMADI=/к[ўоу]'?тарма|kotarma|ko.tarma|не\s*бер[её]т|недозвон|трубка/i;
function kHolatTuzat(l){
  (l||[]).forEach(function(x){
    if(x.holat!=='sotuv' && x.holat!=='sifatsiz' && K_KOTARMADI.test(x.stadiya||'')) x.holat='sifatsiz';
  });
  return l;
}

/** Сифатсиз стадиясига қисқа изоҳ */
function kMusrIzoh(nom){
  var s=String(nom||'').toLowerCase();
  if(/база/.test(s)) return 'база';
  if(K_KOTARMADI.test(s)) return 'кўтармади';
  if(/бизнес|онлайн|онлине|online/.test(s)) return 'бизнеси йўқ';
  if(/провал|некачеств|качеств|сифатсиз/.test(s)) return 'не качество';
  return 'сифатсиз';
}

/**
 * Воронка қатламлари — иккала воронка учун БИР ХИЛ:
 *   1) Сифатсиз лидлар (база + не качество + кўтармади + бизнеси йўқ)
 *   2…) Қолган ҳар бир стадия алоҳида (аввал янги лид, кейин обработка)
 *   охирги) Сотув — сотув стадиялари ҳаммаси битта қатламда
 */
function kQatlamlar(l){
  function guruh(h){ return kGuruh(l.filter(function(x){ return x.holat===h }),function(x){ return x.stadiya||'—' }) }
  function jam(g){ var n=0; g.forEach(function(x){ n+=x.soni }); return n }
  var sif=guruh('sifatsiz'), yan=guruh('yangi'), obr=guruh('obrabotka'), sot=guruh('sotuv');

  var q=[{nom:'Сифатсиз лидлар',son:jam(sif),tur:'sifatsiz',rang:'var(--no)',ichki:sif}];

  var orta=yan.map(function(x){ return {nom:x.nom,son:x.soni,tur:'yangi',rang:'var(--info)'} })
    .concat(obr.map(function(x){ return {nom:x.nom,son:x.soni,tur:'obrabotka',rang:'var(--a)'} }));
  // Стадия жуда кўп бўлса — энг кичиклари битта «бошқа стадиялар»га
  var MAX=6;
  if(orta.length>MAX){
    var qol=orta.slice(MAX-1), bq={nom:'Бошқа стадиялар',son:0,tur:'obrabotka',rang:'var(--a)',ichki:[]};
    qol.forEach(function(x){ bq.son+=x.son; bq.ichki.push({nom:x.nom,soni:x.son}) });
    orta=orta.slice(0,MAX-1).concat([bq]);
  }
  q=q.concat(orta);
  q.push({nom:'Сотув',son:jam(sot),tur:'sotuv',rang:'var(--ok)',ichki:sot});
  return q;
}

/**
 * Учбурчак воронка. Шакли доим бир хил (тепада кенг → пастда тор),
 * рақам ва фоиз ҳар бир қатламда ёзилган.
 *  q    — kQatlamlar() натижаси
 *  tur  — 'mark' (фоиз ишланган лиддан, сифатсиз ва янги кирмайди) | 'sotuv' (фоиз ҳамма лиддан)
 */
function kVoronka(q,tur,j){
  if(!j.jami) return bosh('Бу даврда лид йўқ');
  var sotuvMi=tur==='sotuv', asos=sotuvMi?j.jami:j.hisob;
  var n=q.length, TEP=100, PAST=24;
  function en(i){ return TEP-(TEP-PAST)*i/n }

  var h='<div class="vrn">'+q.map(function(x,i){
    var w1=en(i), w2=en(i+1);
    var a=(50-w1/2).toFixed(2), b=(50+w1/2).toFixed(2), c=(50+w2/2).toFixed(2), d=(50-w2/2).toFixed(2);
    var chetda=!sotuvMi && (x.tur==='sifatsiz'||x.tur==='yangi');   // маркетингда сифатсиз ва янги лид ҳисобга кирмайди
    var f=chetda?(j.jami?x.son/j.jami*100:0):(asos?x.son/asos*100:0);
    return '<div class="vq'+(chetda?' chetda':'')+'" style="--c:'+x.rang+';animation-delay:'+(i*0.06).toFixed(2)+'s">'+
      '<div class="vqs">'+
        '<div class="vqsh" style="clip-path:polygon('+a+'% 0,'+b+'% 0,'+c+'% 100%,'+d+'% 100%)"></div>'+
        '<div class="vqt"><b class="num">'+fmt(x.son)+'</b><span>'+kFoiz(f)+'</span></div>'+
      '</div>'+
      '<div class="vqi">'+
        '<div class="vqn"><em>'+(i+1)+'</em>'+esc(x.nom)+'</div>'+
        '<div class="vqo">'+(chetda
          ? 'жами лиддан <b>'+kFoiz(f)+'</b> · конверсияга кирмайди'
          : (sotuvMi?'жами лиддан ':'ишланган лиддан ')+'<b>'+kFoiz(f)+'</b>')+'</div>'+
      '</div>'+
    '</div>';
  }).join('')+'</div>';

  // Таркиби: бир нечта стадияни ўз ичига олган қатламлар
  var tk=q.map(function(x,i){ return {x:x,i:i} })
          .filter(function(o){ return o.x.ichki && o.x.ichki.length });
  if(tk.length)
    h+='<div class="vtk">'+tk.map(function(o){
      return '<div class="vtkr" style="--c:'+o.x.rang+'"><em>'+(o.i+1)+'</em><div><b>'+esc(o.x.nom)+'</b>'+
        '<div class="vqk">'+o.x.ichki.map(function(s){
          return '<span>'+esc(s.nom)+' <b>'+fmt(s.soni)+'</b></span>' }).join('')+'</div></div></div>';
    }).join('')+'</div>';

  // Пастда — шу воронканинг натижаси
  h+= sotuvMi
    ? '<div class="vxl" style="--c:var(--ok)"><span>Сотув конверсия</span>'+
        '<em>'+fmt(j.sotuv)+' сотув ÷ '+fmt(j.jami)+' жами лид</em><b class="num">'+kFoiz(j.skonv)+'</b></div>'
    : '<div class="vxl" style="--c:var(--info)"><span>Маркетинг конверсия</span>'+
        '<em>'+fmt(j.sotuv)+' сотув ÷ '+fmt(j.hisob)+' ишланган лид · сифатсиз '+kFoiz(j.sfoiz)+' · янги '+kFoiz(j.jami?j.yangi/j.jami*100:0)+'</em><b class="num">'+kFoiz(j.mkonv)+'</b></div>';
  return h;
}

function kMarkVoronka(l,j){ return kVoronka(kQatlamlar(l),'mark',j) }
function kSotuvVoronka(j,l){ return kVoronka(kQatlamlar(l),'sotuv',j) }

/** Катта фоиз картаси (ҳалқа билан) */
function kKonvKarta(nom,f,rang,izoh,formula){
  return '<div class="kvk" style="--pc:'+rang+'">'+
    halqa(f,rang,86,11,'<b class="num" style="font-size:19px">'+kFoiz(f)+'</b>')+
    '<div class="kvkm"><div class="kvkn">'+esc(nom)+'</div>'+
      '<div class="kvkf">'+formula+'</div>'+
      '<div class="kvkd">'+izoh+'</div></div></div>';
}

/** Таргетолог картаси — иккала конверсия алоҳида */
function kTargetKonvKarta(x){
  function bar(f,r){ return '<div class="kvb"><i style="width:'+Math.min(100,Math.max(2,f))+'%;background:'+r+'"></i></div>' }
  return '<div class="kvt">'+
    '<div class="kvth"><b>'+esc(x.nom)+kSotTeg(x.nom)+'</b><span>'+fmt(x.jami)+' та лид</span></div>'+
    '<div class="kvt2">'+
      '<div><span>Маркетинг конв.</span><b class="num" style="color:var(--info)">'+kFoiz(x.mkonv)+'</b>'+
        bar(x.mkonv,'var(--info)')+'<em>'+fmt(x.sotuv)+' сотув / '+fmt(x.hisob)+' ишланган</em></div>'+
      '<div><span>Сотув конв.</span><b class="num" style="color:var(--ok)">'+kFoiz(x.skonv)+'</b>'+
        bar(x.skonv,'var(--ok)')+'<em>'+fmt(x.sotuv)+' сотув / '+fmt(x.jami)+' жами</em></div>'+
    '</div>'+
    '<div class="kvtq">'+
      '<span>сифатсиз <b style="color:var(--no)">'+fmt(x.musr)+'</b> · '+kFoiz(x.jami?x.musr/x.jami*100:0)+'</span>'+
      '<span>янги <b>'+fmt(x.yangi)+'</b></span>'+
    '</div></div>';
}

/** Bitrix стадиялари бўйича тўлиқ жадвал (телефонда ҳам ишлайди) */
function kStadiyaKonv(l,j){
  var tartib=['sifatsiz','yangi','obrabotka','sotuv'];
  var nom={sifatsiz:'Сифатсиз',yangi:'Янги лид',obrabotka:'Обработка',sotuv:'Сотув'};
  var h='<div class="kst"><div class="kstr kstb"><span>Стадия</span><span>Гуруҳ</span>'+
        '<span>Лид</span><span>Жамидан</span><span>Ишлангандан</span></div>';
  tartib.forEach(function(g){
    var lst=kGuruh(l.filter(function(x){ return x.holat===g }),function(x){ return x.stadiya||'—' });
    if(!lst.length) return;
    var jm=0; lst.forEach(function(x){ jm+=x.soni });
    h+='<div class="kstg" style="--c:'+MK_RANG[g]+'"><b>'+nom[g]+'</b><span>'+fmt(jm)+' та · жамидан '+
       kFoiz(j.jami?jm/j.jami*100:0)+((g==='obrabotka'||g==='sotuv')?' · ишлангандан '+kFoiz(j.hisob?jm/j.hisob*100:0):'')+'</span></div>';
    lst.forEach(function(x){
      var fj=j.jami?x.soni/j.jami*100:0, fs=((g==='obrabotka'||g==='sotuv')&&j.hisob)?x.soni/j.hisob*100:null;
      h+='<div class="kstr">'+
        '<span class="kstn">'+esc(x.nom)+'</span>'+
        '<span><em class="kstp" style="--c:'+MK_RANG[g]+'">'+(g==='sifatsiz'?kMusrIzoh(x.nom):nom[g])+'</em></span>'+
        '<span class="num"><b>'+fmt(x.soni)+'</b></span>'+
        '<span class="num">'+kFoiz(fj)+'<i class="kstb2"><i style="width:'+Math.max(1.5,fj)+'%;background:'+MK_RANG[g]+'"></i></i></span>'+
        '<span class="num">'+(fs===null?'<span style="opacity:.4">—</span>':kFoiz(fs))+'</span>'+
      '</div>';
    });
  });
  return h+'</div>';
}

/** Ойлар бўйича иккала конверсия */
function kOyKonv(l){
  var m={},t=[];
  l.forEach(function(x){
    var d=sanaOqi(x.sana); if(!d) return;
    var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
    if(!m[k]){ m[k]={k:k,jami:0,yangi:0,sifatsiz:0,sotuv:0,obrabotka:0}; t.push(k) }
    m[k].jami++; m[k][x.holat]++;
  });
  t.sort();
  if(t.length<2) return '';
  var h='<div class="koy"><div class="koyr koyb"><span>Ой</span><span>Лид</span>'+
        '<span>Маркетинг конв.</span><span>Сотув конв.</span><span>Сифатсиз</span></div>';
  t.forEach(function(k){
    var o=kKonvHisob(m[k]);
    h+='<div class="koyr"><span><b>'+OYLAR[+k.slice(5)-1]+'</b> '+k.slice(0,4)+'</span>'+
      '<span class="num">'+fmt(o.jami)+'</span>'+
      '<span class="num"><i class="kvb"><i style="width:'+Math.max(2,o.mkonv)+'%;background:var(--info)"></i></i>'+kFoiz(o.mkonv)+'</span>'+
      '<span class="num"><i class="kvb"><i style="width:'+Math.max(2,Math.min(100,o.skonv))+'%;background:var(--ok)"></i></i>'+kFoiz(o.skonv)+'</span>'+
      '<span class="num" style="color:var(--no)">'+kFoiz(o.sfoiz)+'</span></div>';
  });
  return h+'</div>';
}

function markKonv(){
  var h=sarlavha('Конверсия','Маркетинг конверсия (ишланган лиддан) ва сотув конверсия (ҳамма лиддан)',
    sanaFiltr()+mobilTugma());
  var b=kBoshHolat();
  if(b && b.eski){ h+=b.eski; b='' }           // хато, лекин эски маълумот бор — огоҳлантириб давом этамиз
  if(b) return h+b;

  var l=kSatrlar(), j=kJam(l);
  var tg=kTargetlar(sanaFiltrla(kD()));

  h+=kTargetSeg();

  h+='<div class="kvg">'+
    kKonvKarta('Маркетинг конверсия',j.mkonv,'var(--info)',
      fmt(j.sotuv)+' сотув · '+fmt(j.hisob)+' ишланган лид',
      'сотув ÷ ишланган лид (сифатсиз ва янгисиз)')+
    kKonvKarta('Сотув конверсия',j.skonv,'var(--ok)',
      fmt(j.sotuv)+' сотув · '+fmt(j.jami)+' жами лид',
      'сотув ÷ ҳамма лид')+
    kKonvKarta('Сифатсиз лидлар',j.sfoiz,'var(--no)',
      fmt(j.musr)+' та · база, не качество, кўтармади, бизнеси йўқ',
      'сифатсиз ÷ жами лид')+
  '</div>';

  h+='<div class="two" style="margin-top:6px">'+
     '<div><div class="sec"><h2>Маркетинг воронкаси</h2>'+
       '<p>Сифатсиз ва янги лидлар ҳисобга кирмайди — фоиз ишланган лиддан. Уларнинг улуши алоҳида кўрсатилган</p></div>'+
       '<div class="panel">'+kMarkVoronka(l,j)+'</div></div>'+
     '<div><div class="sec"><h2>Сотув воронкаси</h2>'+
       '<p>Худди шу стадиялар, фоиз ҳамма лиддан — сифатсизлар ҳам ҳисобга киради</p></div>'+
       '<div class="panel">'+kSotuvVoronka(j,l)+'</div></div>'+
  '</div>';

  if(tg.length){
    h+='<div class="sec"><h2>Таргетологлар кесимида</h2>'+
       '<p>Маркетинг конверсия — ишланган лиддан, сотув конверсия — ҳамма лиддан</p></div>'+
       '<div class="kvtg">'+tg.map(kTargetKonvKarta).join('')+'</div>';
  }

  var oy=kOyKonv(l);
  if(oy) h+=bolim('Ойлар бўйича','Иккала конверсия қандай ўзгариб боряпти',oy);

  h+=bolim('Bitrix стадиялари бўйича','Ҳар бир стадияда нечта лид ва унинг улуши',kStadiyaKonv(l,j));

  h+='<div class="fizoh"><div class="eb">Қандай ҳисобланади</div>'+
     '<p><b>Сифатсиз лид</b> — «База», «Сделка провалена» (не качество), «Кўтармади» ва «Бизнеси йўқ» стадиялари.<br>'+
     '<b>Янги лид</b> — «Маркетинг новие лид», «Янги лид»: ҳали ишланмаган, музлаб турган лидлар.<br>'+
     '<b>Маркетинг конверсия</b> = сотув ÷ ишланган лид (сифатсиз ва янги лид ҳисобга кирмайди). '+
       'Масалан 1000 лиддан 500 таси сифатсиз, 100 таси янги, қолган 400 тадан 40 та сотув — 10%.<br>'+
     '<b>Сотув конверсия</b> = сотув ÷ ҳамма лид. Ўша мисолда 40 ÷ 1000 — 4%.<br>'+
     '<b>Сифатсиз улуши</b> = сифатсиз ÷ жами лид. Ўша мисолда — 50%.</p></div>';

  h+=kFiltrIzoh(l,j);
  return h;
}


/* ── 15.4 ЛИДЛАР ─────────────────────────────────────── */

function markJurnal(){
  var h=sarlavha('Лидлар','Лидлар жадвалидаги ёзувлар',
    '<input type="text" id="qid" placeholder="Стадия, манба, менежер…" value="'+esc(S.qidiruv)+'" style="width:200px">'+
    sanaFiltr()+mobilTugma());
  var b=kBoshHolat();

     '<th>Ҳолат</th><th>Менежер</th></tr></thead><tbody>'+
     (kes.length?kes.map(function(x){
       return '<tr><td class="num" style="color:var(--muted)">'+dfmt(x.sana)+'</td>'+
         '<td style="font-weight:500">'+esc(x.target)+'</td>'+
         '<td style="color:var(--muted)">'+esc(x.manba||'—')+'</td>'+
         '<td>'+esc(x.stadiya||'—')+'</td>'+
         '<td><span class="pill" style="color:'+MK_RANG[x.holat]+';border-color:currentColor">'+
           MK_NOM[x.holat]+'</span></td>'+
         '<td style="color:var(--muted)">'+esc(x.menejer||'—')+'</td></tr>';
     }).join(''):'<tr><td colspan="6" style="padding:26px;text-align:center;color:var(--muted)">Лид топилмади</td></tr>')+
     '</tbody></table></div></div>';

  h+='<div class="jfaqat">'+(kes.length?kLidRoyxat(kes):bosh('Лид топилмади'))+'</div>';
  if(l.length>300) h+='<div class="sub" style="margin-top:10px">Охирги 300 таси кўрсатилди (жами '+fmt(l.length)+')</div>';
  return h;
}

/** Телефон учун — сана бўйича гуруҳланган лидлар */
function kLidRoyxat(l){
  var g={},t=[];
  l.forEach(function(x){
    var k=dfmt(x.sana);
    if(!g[k]){ g[k]=[]; t.push(k) }
    g[k].push(x);
  });
  return '<div class="jlist">'+t.map(function(k){
    var lst=g[k], so=lst.filter(function(x){ return x.holat==='sotuv' }).length;
    return '<div class="jkun"><div class="jsar"><b>'+k+'</b><span>'+lst.length+' та · сотув '+so+'</span></div>'+

/* RBA — 15 бошқарув панели: фақат шу поток продуктлари.

var PV_PROD=[
  {k:'praktikum', nom:'3 кунлик', rang:'#E0A048'},
  {k:'kouch',     nom:'Коучинг',  rang:'#4ECB92'}
];

var HAFTA_KUN=['якшанба','душанба','сешанба','чоршанба','пайшанба','жума','шанба'];
var OY_NOM=['январ','феврал','март','апрел','май','июн','июл','август','сентябр','октябр','ноябр','декабр'];

function kechaSana(){ var k=new Date(); k.setHours(0,0,0,0); k.setDate(k.getDate()-1); return k }
function kechaMi(sana){
  var d=sanaOqi(sana); if(!d) return false;
  d.setHours(0,0,0,0);
  return d.getTime()===kechaSana().getTime();
}
function kechaMatn(){
  var k=kechaSana();
  return k.getDate()+' '+OY_NOM[k.getMonth()]+', '+HAFTA_KUN[k.getDay()];
}

/** Продуктнинг ҳамма сотувлари (ёки null — юкланмаган) */
function pvBarcha(k){
  if(!D) return null;
  if(k==='ai') return D.ai||null;
  return (k==='praktikum'?D.praktikum:D.kouch)||[];
}

/** Режа («план» варағидан) */
function pvReja(k){
  if(k==='turon'){ var tp=tPlan(); return {reja:tp.reja,fakt:tp.fakt,qoldi:tp.qoldi,foiz:tp.foiz} }
  var l = k==='ai' ? (D&&D.aiReja)||[] : (D&&D.reja&&D.reja[k])||[];
  if(!Array.isArray(l)) l=[];
  var o={reja:0,fakt:0};
  l.forEach(function(x){ o.reja+=x.reja; o.fakt+=x.fakt });
  o.qoldi=Math.max(0,o.reja-o.fakt);
  o.foiz=o.reja?o.fakt/o.reja*100:0;
  return o;
}

/** Ҳалқа (доира прогресс) */
function halqa(f,rang,olcham,qalin,ichi){
  var R=52, C=2*Math.PI*R, d=Math.max(0,Math.min(100,f))/100*C;
  qalin=qalin||10;
  return '<div class="halqa-w" style="width:'+olcham+'px;height:'+olcham+'px">'+
    '<svg width="'+olcham+'" height="'+olcham+'" viewBox="0 0 120 120">'+
      '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="'+qalin+'"/>'+
      '<circle class="hq" cx="60" cy="60" r="'+R+'" fill="none" stroke="'+rang+'" stroke-width="'+qalin+'" '+
        'stroke-linecap="round" stroke-dasharray="'+d.toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 60 60)"/>'+
    '</svg><div class="halqa-m">'+(ichi||'')+'</div></div>';
}

/** Валюта билан сумма: $1 200 · 1 830 000 TJS */
function vPul(n,v){
  if(v==='USD') return (n<0?'−':'')+'$'+fmt(Math.abs(n));
  return (n<0?'−':'')+fmt(Math.abs(n))+' TJS';
}

function pvKutish(m){
  return '<div class="pv-wait"><div class="spin"></div>'+esc(m||'Юкланмоқда…')+'</div>';
}

/* «Киргизистан» ва «Қирғизистон», «Козогистон» ва «Казахстан» —
   ёзилиши ҳар хил, шунинг учун охирги «стан/стон» бир кўринишга келтирилади. */
function davlatNorm(nom){
  return shaharNorm(nom).replace(/стан$/,'стон');
}

function davlatTop(nom){
  var t=davlatNorm(nom);
  if(!t) return null;
  for(var i=0;i<AI_DAVLAT.length;i++)
    if(t===davlatNorm(AI_DAVLAT[i].kalit)) return AI_DAVLAT[i];
  return null;
}

/**
 * ДАВЛАТЛАР ХАРИТАСИ — чегаралар бўялади, марказига доира ва рақам қўйилади.
 * Харитада йўқ давлатлар пастда чип бўлиб чиқади.
 */
function xaritaDavlat(guruh){
  var nuq=[], tashqari=[];
  guruh.forEach(function(g){
    var d=davlatTop(g.nom);
    if(d) nuq.push({d:d, g:g}); else tashqari.push(g);
  });
  if(!nuq.length) return '';

  var W=XARITA_W, H=XARITA_H, max=1, jami=0;
  nuq.forEach(function(x){ if(x.g.soni>max) max=x.g.soni; jami+=x.g.soni });

  // ── чегаралар ──
  var bor={};
  nuq.forEach(function(x){ bor[x.d.kod]=x });
  var yer='';
  ['tm','kz','uz','kg','tj'].forEach(function(k,i){     // tm аввал — Ўзбекистон чегараси устидан чизилади
    var x=bor[k];
    var c=x?DAVLAT_RANG[x.d.nom]:null;
    yer+='<path class="xyer'+(x?' faol':'')+'" d="'+XARITA_YOL[k]+'" '+
      'fill="'+(c||'var(--line)')+'" stroke="'+(c||'var(--line2)')+'" '+
      'style="animation-delay:'+(i*0.09).toFixed(2)+'s"><title>'+
      (x?esc(x.d.nom)+' — '+fmt(x.g.soni)+' та сотув':'')+'</title></path>';
  });

  // ── доиралар ──
  var shar='';
  nuq.forEach(function(x,i){
    var c=x.d.chet==='yuqori' ? [x.d.cx||118, 48] : xproy(x.d.lon,x.d.lat);
    var px=c[0], py=c[1];
    var r=14+20*Math.sqrt(x.g.soni/max);
    var rng=DAVLAT_RANG[x.d.nom]||'var(--a)';
    var ulush=(jami?Math.round(x.g.soni/jami*100)+'%':'')+(x.d.chet==='yuqori'?' · шимолда ↑':'');
    // Харитадан ташқаридаги давлат (Россия): доирадан юқорига стрелка
    var chet=x.d.chet==='yuqori'
      ? '<line class="xchet" x1="'+px.toFixed(1)+'" y1="'+(py-r).toFixed(1)+'" x2="'+px.toFixed(1)+'" y2="4" stroke="'+rng+'"/>'+
        '<path d="M'+(px-5).toFixed(1)+' 10L'+px.toFixed(1)+' 3L'+(px+5).toFixed(1)+' 10" fill="none" stroke="'+rng+'" stroke-width="2" stroke-linecap="round"/>'
      : '';
    shar+='<g class="xsh" style="animation-delay:'+(0.4+i*0.1).toFixed(2)+'s">'+chet+
      '<circle class="xdoira" cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+r.toFixed(1)+
        '" fill="'+rng+'" fill-opacity=".38" stroke="'+rng+'" stroke-width="2"/>'+
      '<text class="xson" x="'+px.toFixed(1)+'" y="'+py.toFixed(1)+'" text-anchor="middle" '+
        'dominant-baseline="central">'+fmt(x.g.soni)+'</text>'+
      '<text class="xnom" x="'+px.toFixed(1)+'" y="'+(py+r+16).toFixed(1)+'" text-anchor="middle">'+
        esc(x.d.nom)+'</text>'+
      '<text class="xizoh" x="'+px.toFixed(1)+'" y="'+(py+r+30).toFixed(1)+'" text-anchor="middle" '+
        'fill="'+rng+'">'+ulush+'</text>'+
      '<title>'+esc(x.d.nom)+' — '+fmt(x.g.soni)+' та сотув</title></g>';
  });

  var chip = tashqari.length
    ? '<div class="xtashq">'+tashqari.map(function(g){
        return '<span class="xchip"><b>'+fmt(g.soni)+'</b>'+esc(g.nom)+'</span>';
      }).join('')+'</div>'
    : '';

  var afsona='<div class="xafs">'+nuq.map(function(x){
    return '<span><i style="background:'+DAVLAT_RANG[x.d.nom]+'"></i>'+esc(x.d.nom)+
           ' <b>'+fmt(x.g.soni)+'</b></span>';
  }).join('')+'</div>';

  return '<div class="xkarta"><div class="xscroll">'+
    '<svg class="xsvg" viewBox="0 0 '+W+' '+H+'">'+yer+shar+'</svg></div>'+
    '<div class="xsurish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+
      '<path d="M5 12h14M12 5l7 7-7 7"/></svg>Харитани чапга-ўнгга суринг</div>'+
    afsona+chip+'</div>';
}

/* ── BOLT AI (қўнғироқлар таҳлили) — ҳамкор саҳифаси iframe да. Панелдан ҳеч нарса (токен, роль, қурилма, мавзу) узатилмайди.
   sandbox: скрипт/форма/логин/попапга рухсат, лекин панелни бошқа сайтга йўналтириш — йўқ. */
function nexumMi(){ return S.prod==='nexum' }
function nexumChiz(){
  // Iframe бир марта яратилади ва панел ёпилгунча сақланади (main дан ташқарида) —
  // бошқа бўлимга ўтиб қайтганда ҳамкор саҳифаси қайта юкланмайди, логини сақланиб қолади.
  var box=document.getElementById('nexumBox');
  if(!box){
    // ?v=вақт — фақат кэшни четлаб ўтиш учун (бош саҳифа iframe ичида эски/бўш нусхадан очилиб қоларди); панел маълумоти эмас
    var nxSrc=NEXUM_URL+(NEXUM_URL.indexOf('?')<0?'?':'&')+'v='+Date.now();
    box=document.createElement('div'); box.id='nexumBox';
    box.innerHTML='<iframe id="nexumIfr" src="'+esc(nxSrc)+'" title="Bolt AI" referrerpolicy="no-referrer" '+
      'sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals allow-storage-access-by-user-activation" '+
      'allow="clipboard-write; fullscreen"></iframe>';
    document.body.appendChild(box);
  }
  if(!main.querySelector('.nxw')) main.innerHTML='<div class="nxw"></div>';   // main бўш — устида #nexumBox туради
}

  }

  var axh=yoqMi()?null:arxHolat();

    ? ulanmaganSahifa()
    : axh

    ? arxPanelSahifa()

    : iiPanelMi()

    : itMi()
    ? ( S.sahifa==='kesim' ? itLitsenziya() : itUmumiy() )
    : rosMi()
    ? ( S.sahifa==='jurnal' ? rosRoyxat() : rosUmumiy() )

    ? ( S.sahifa==='kesim' ? kalOy() : S.sahifa==='jurnal' ? kalRoyxatSahifa() : kalHafta() )
    : ymMi()
    ? ( S.sahifa==='jurnal'  ? ymSotuvlar() :
        S.sahifa==='menejer' ? ymXarita()   :

    : moliyaMi()

        S.sahifa==='kesim'   ? moliyaYonalish('chiqim'): moliyaJurnal() )
    : ( S.sahifa==='umumiy'  ? umumiySahifa()  :
        S.sahifa==='menejer' ? menejerSahifa() :

  // Телефонда харита кенг — уни шаҳарлар турган жойга суриб қўямиз

  }

  /* Бўлим тугмалари икки жойда: чап менюда ва пастки панелда */

  if(y.k==='asosiy') return true;

  if(y.k==='ind') return indUlangan();
  if(y.k==='ym') return ymUlangan();

async function hammasiYangila(){
  if(S.yangilanmoqda){ xabar('Янгиланмоқда — кутинг…'); return }
  if(!D){ yukla(false); return }
  S.yangilanmoqda=true; S.yangi=true;     // S.yangi — сервердаги кэшни четлаб ўтамиз (фақат шу саҳифа учун)
  document.body.classList.add('yangilanmoqda');
  var tx=document.querySelector('#yangilaBtn span'); if(tx) tx.textContent='Янгиланмоқда…';

  var hamma=YUKLOVCHI.filter(function(y){ return (!y.admin||adminMi()) && yuklovchiUlangan(y) });
  var avval=hamma.filter(function(y){ return y.kerak() });

  // 1) очиқ саҳифа — аввал, параллел, янги маълумот билан
  xabar('Янгиланмоқда…');
  yangiHolat('янгиланмоқда · '+avval.map(function(y){ return y.nom }).join(', '));
  await Promise.all(avval.map(function(y){ return Promise.resolve().then(y.f).catch(function(){}) }));
  if(!S.band) saqla();
  S.yangi=false; S.yangilanmoqda=false;
  document.body.classList.remove('yangilanmoqda');
  if(tx) tx.textContent='Янгилаш';

  document.head.appendChild(st) })();

/* ── маълумот ── */
var SK_WH_RANG=['#E0A048','#6FA8DC','#4ECB92','#A08FD0','#D77B96'];
var SK_KAT_RANG=['#E0A048','#4ECB92','#6FA8DC','#A08FD0','#D77B96','#C08B5E','#D9A22B','#5E9BD6','#6BCBA0','#EC9BB2'];
var SK_IKO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M7 21v-8h10v8M7 17h10"/></svg>';
function r3(x){ return Math.round(x*1000)/1000 }
function skN(v){ return String(v||'').toLowerCase().replace(/\s+/g,' ').trim() }
function skSkladlar(){ var m={}; ((D&&D.ros)||[]).forEach(function(x){ if(x.sklad&&x.sklad!=='—') m[x.sklad]=1 }); return Object.keys(m).sort() }
function skRang(s){ var i=skSkladlar().indexOf(s); return SK_WH_RANG[(i<0?0:i)%SK_WH_RANG.length] }
function skBarcha(){ var l=(D&&D.ros)||[]; return S.skSklad==='hammasi'?l:l.filter(function(x){ return x.sklad===S.skSklad }) }
function skBirlik(kv){ return kv?'кв':'шт' }
function skOxirgi(l){ var e=''; l.forEach(function(x){ if(x.sana>e) e=x.sana }); return e }
/* Товарлар: Тип Заказ + Имя Заказ + Тип товар + Тип Число; ҳар склад алоҳида қолдиқ */
function skTovarlar(l){
  var m={},t=[];
  l.forEach(function(x){ var k=[x.tur,x.nomi,x.tovar,mmKv(x.birlik)?'кв':''].map(skN).join('|');
    if(!m[k]){ m[k]={tur:x.tur,nomi:x.nomi,tovar:x.tovar,kv:mmKv(x.birlik),kirim:0,chiqim:0,qoldiq:0,sk:{},oxirgi:''}; t.push(k) }
    var o=m[k], n=+x.soni||0, s=x.sklad||'—', d=x.harakat==='kirim'?n:-n;
    if(x.harakat==='kirim') o.kirim+=n; else o.chiqim+=n;
    o.sk[s]=(o.sk[s]||0)+d; o.qoldiq+=d; if(x.sana>o.oxirgi) o.oxirgi=x.sana });
  return t.map(function(k){ var o=m[k]; o.qoldiq=r3(o.qoldiq); o.kirim=r3(o.kirim); o.chiqim=r3(o.chiqim);
    Object.keys(o.sk).forEach(function(s){ o.sk[s]=r3(o.sk[s]) });
    /* Ҳолат жами қолдиқ бўйича; битта омбордаги минус устунда қизил кўринади, омбор танланса — ўзи «Минус» бўлади */
    o.holat=o.qoldiq<0?'minus':(o.qoldiq>0?'bor':'yoq'); return o }) }
function skJami(tv){ var o={sht:0,kv:0,sku:0,minus:0,yoq:0};
  tv.forEach(function(x){ if(x.holat==='minus') o.minus++; else if(x.holat==='yoq') o.yoq++;
    if(x.qoldiq>0){ if(x.kv) o.kv+=x.qoldiq; else o.sht+=x.qoldiq; o.sku++ } });
  o.sht=r3(o.sht); o.kv=r3(o.kv); return o }
function skHarJam(l){ var o={kSht:0,kKv:0,cSht:0,cKv:0,n:l.length};
  l.forEach(function(x){ var n=+x.soni||0, kv=mmKv(x.birlik); if(x.harakat==='kirim'){ if(kv) o.kKv+=n; else o.kSht+=n } else { if(kv) o.cKv+=n; else o.cSht+=n } });
  ['kSht','kKv','cSht','cKv'].forEach(function(k){ o[k]=r3(o[k]) }); return o }
function skBirlikMatn(sht,kv){ return mmSon(sht)+' шт'+(kv?' · '+mmSon(kv)+' кв':'') }
/* Категориялар (Имя Заказ) */
function skKatlar(tv,oyl){
  var m={},t=[], sl=skSkladlar();
  tv.forEach(function(x){ var k=x.nomi||'—'; if(!m[k]){ m[k]={nom:k,sht:0,kv:0,sku:0,minus:0,sk:{},kir:0,chiq:0,kirKv:0,chiqKv:0}; t.push(k) }
    var o=m[k]; if(x.holat==='minus') o.minus++;
    if(x.qoldiq>0){ o.sku++; if(x.kv) o.kv+=x.qoldiq; else o.sht+=x.qoldiq }
    sl.forEach(function(s){ var v=x.sk[s]||0; if(v>0&&!x.kv) o.sk[s]=(o.sk[s]||0)+v }) });
  (oyl||[]).forEach(function(x){ var o=m[x.nomi||'—']; if(!o) return; var n=+x.soni||0, kv=mmKv(x.birlik);
    if(x.harakat==='kirim'){ if(kv) o.kirKv+=n; else o.kir+=n } else { if(kv) o.chiqKv+=n; else o.chiq+=n } });
  return t.map(function(k){ var o=m[k]; o.kvAsos=!o.sht&&o.kv>0; o.asos=r3(o.kvAsos?o.kv:o.sht); return o })
    .sort(function(a,b){ return (b.sht+b.kv)-(a.sht+a.kv) }) }

/* ── бўлаклар ── */
function skSeg(){ var sl=skSkladlar(); if(sl.length<2) return '';
  return '<div class="seg">'+['hammasi'].concat(sl).map(function(k){ return '<button data-sk="'+esc(k)+'" class="'+(S.skSklad===k?'on':'')+'">'+(k==='hammasi'?'Ҳаммаси':esc(k))+'</button>' }).join('')+'</div>' }
function skKub(k,i){
  var sl=skSkladlar(), jami=0; sl.forEach(function(s){ jami+=k.sk[s]||0 });
  var split=jami?'<div class="sk-split">'+sl.map(function(s){ var v=k.sk[s]||0; return v?'<i style="width:'+(v/jami*100).toFixed(1)+'%;background:'+skRang(s)+'" title="'+esc(s)+': '+mmSon(v)+' шт"></i>':'' }).join('')+'</div>'
    :'<div class="sk-split"></div>';
  var kir=k.kvAsos?k.kirKv:k.kir, chq=k.kvAsos?k.chiqKv:k.chiq;
  return '<button class="sk-kub" data-skkat="'+esc(k.nom)+'" style="--pc:'+SK_KAT_RANG[i%SK_KAT_RANG.length]+';animation-delay:'+Math.min(i*.03,.4).toFixed(2)+'s">'+
    '<div class="sk-kh"><b>'+esc(k.nom)+'</b>'+(k.minus?'<em class="q">'+k.minus+' минус</em>':'<em>'+k.sku+' тур</em>')+'</div>'+
    '<div class="sk-kv num">'+mmSon(k.asos)+'<small>'+skBirlik(k.kvAsos)+'</small></div>'+
    '<div class="sk-ks">'+(!k.kvAsos&&k.kv?'+ '+mmSon(k.kv)+' кв':(k.minus?k.sku+' тур бор':''))+'</div>'+split+
    '<div class="sk-kf"><span class="k">↑ '+mmSon(kir)+'</span><span class="c">↓ '+mmSon(chq)+'</span><span>шу ой</span></div></button>' }
function skLegenda(){ var sl=skSkladlar(); if(sl.length<2||S.skSklad!=='hammasi') return '';
  return '<div class="sk-leg">'+sl.map(function(s){ return '<span><i style="background:'+skRang(s)+'"></i>'+esc(s)+'</span>' }).join('')+'<span>· чизиқ — дона қолдиқнинг омборлар бўйича улуши</span></div>' }
function skYr(x){ var kir=x.harakat==='kirim';
  return '<div class="pv-yr"><i class="'+(kir?'k':'c')+'">'+(kir?'+':'−')+'</i>'+
    '<div class="pv-yn"><b>'+esc(x.tovar)+'</b><span>'+esc([x.nomi,x.sklad,dfmt(x.sana),x.qaerdan,x.izoh].filter(function(t){ return t&&t!=='—' }).join(' · '))+'</span></div>'+
    '<div class="pv-ys num '+(kir?'k':'c')+'">'+(kir?'+':'−')+mmSon(x.soni)+' '+skBirlik(mmKv(x.birlik))+'</div></div>' }
function skQ(v,kv){ return '<span class="sk-q '+(v<0?'c':v>0?'k':'z')+'">'+mmSon(v)+'</span> <small style="color:var(--muted)">'+skBirlik(kv)+'</small>' }

/* ── 1. ОМБОР ── */
function skOmbor(){
  var tvAll=skTovarlar((D&&D.ros)||[]), oyAll=mmShuOy((D&&D.ros)||[]);
  var l=skBarcha(), tv=skTovarlar(l), j=skJami(tv), oy=skHarJam(mmShuOy(l)), ox=skOxirgi(l), sl=skSkladlar();
  var h=sarlavha('Склад — омбор','Омборда ҳозир нима бор · «База Склад» бўйича'+(ox?' · охирги ҳаракат '+dfmt(ox):''),skSeg()+mobilTugma());
  h+='<div class="mets">'+
    mmMet('o','Омборда · дона',mmSon(j.sht)+' <small>шт</small>',fmt(tv.filter(function(x){ return x.qoldiq>0&&!x.kv }).length)+' тур товар')+
    mmMet('','Омборда · квадрат',mmSon(j.kv)+' <small>кв</small>',fmt(tv.filter(function(x){ return x.qoldiq>0&&x.kv }).length)+' тур товар')+
    mmMet('k','Шу ой кирди',mmSon(oy.kSht)+' <small>шт</small>',(oy.kKv?'+ '+mmSon(oy.kKv)+' кв · ':'')+'чиқди '+mmSon(oy.cSht)+' шт')+
    mmMet(j.minus?'c':'','Минусда',fmt(j.minus)+' <small>тур</small>',j.minus?'расход приходдан кўп — текширинг':'ҳаммаси жойида')+'</div>';

  /* Омборлар */
  if(sl.length){
    var jSht=0; var wl=sl.map(function(s){ var t=skTovarlar(((D&&D.ros)||[]).filter(function(x){ return x.sklad===s })), w=skJami(t); jSht+=w.sht;
      return {s:s,w:w,oy:skHarJam(oyAll.filter(function(x){ return x.sklad===s })),ox:skOxirgi(((D&&D.ros)||[]).filter(function(x){ return x.sklad===s }))} });
    h+='<div class="sec"><h2>Омборлар</h2><p>Картани босинг — бутун бўлим шу омбор бўйича кўрсатилади</p></div><div class="sk-whg">'+
      wl.map(function(o,i){ var f=foiz(o.w.sht,jSht);
        return '<button class="sk-wh'+(S.skSklad===o.s?' on':'')+'" data-sk="'+esc(S.skSklad===o.s?'hammasi':o.s)+'" style="--pc:'+skRang(o.s)+';animation-delay:'+(i*.06)+'s">'+
          '<div class="sk-whh"><span class="sk-ico">'+SK_IKO+'</span><div><b>'+esc(o.s)+'</b><span>'+fmt(o.w.sku)+' тур товар'+(o.ox?' · охирги '+dqisqa(o.ox):'')+'</span></div><em>'+f+'%</em></div>'+
          '<div class="sk-whv"><div><b class="num">'+mmSon(o.w.sht)+'</b><span>дона (шт)</span></div><div><b class="num">'+mmSon(o.w.kv)+'</b><span>квадрат (кв)</span></div>'+
            '<div><b class="num '+(o.w.minus?'q':'z')+'">'+fmt(o.w.minus)+'</b><span>минусда</span></div></div>'+
          '<div class="sk-prog"><i style="width:'+f+'%"></i></div>'+
          '<div class="sk-whf"><span>Шу ой:</span><span class="k">↑ '+skBirlikMatn(o.oy.kSht,o.oy.kKv)+'</span><span class="c">↓ '+skBirlikMatn(o.oy.cSht,o.oy.cKv)+'</span></div></button>' }).join('')+'</div>';
  }

  /* Категориялар */
  var kl=skKatlar(tv,mmShuOy(l));
  h+='<div class="sec"><h2>Категориялар</h2><p>Имя Заказ бўйича қолдиқ · кубни босинг — шу категория товарлари очилади</p></div>'+skLegenda()+
    (kl.length?'<div class="sk-kubg">'+kl.map(skKub).join('')+'</div>':bosh('Товар йўқ'));

  /* Эътибор + охирги ҳаракат */
  var mn=tv.filter(function(x){ return x.holat==='minus' }).sort(function(a,b){ return a.qoldiq-b.qoldiq });
  var so=l.slice().sort(function(a,b){ return String(b.sana).localeCompare(String(a.sana)) }).slice(0,8);
  h+='<div class="sk-two"><div><div class="sec"><h2>Эътибор талаб</h2><p>Минусга тушган товарлар — расход приходдан кўп ёзилган</p></div><div class="pv-card">'+
    (mn.length?'<div class="pv-yz">'+mn.slice(0,8).map(function(x){
        return '<div class="pv-yr"><i class="c">!</i><div class="pv-yn"><b>'+esc(x.tovar)+'</b><span>'+esc(x.nomi)+' · '+
          Object.keys(x.sk).map(function(s){ return s+': '+mmSon(x.sk[s]) }).join(' · ')+'</span></div><div class="pv-ys num c">'+mmSon(x.qoldiq)+' '+skBirlik(x.kv)+'</div></div>' }).join('')+'</div>'+
        (mn.length>8?'<button class="pv-lnk" data-skq="minus" data-p2go="kesim">Ҳаммаси — '+mn.length+' та →</button>':'')
      :'<div class="sk-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Минусда товар йўқ</div>')+'</div></div>'+
    '<div><div class="sec"><h2>Охирги ҳаракатлар</h2><p>Омборга кирган ва чиққан охирги ёзувлар</p></div><div class="pv-card">'+
      (so.length?'<div class="pv-yz">'+so.map(skYr).join('')+'</div>':'<div class="pv-wait">Ёзув йўқ</div>')+
      '<button class="pv-lnk" data-p2go="jurnal" style="margin-top:6px">Ҳамма ҳаракатлар →</button></div></div></div>';
  return h }

/* ── 2. ТОВАРЛАР ── */
function skTovarSahifa(){
  var l=skBarcha(), sl=S.skSklad==='hammasi'?skSkladlar():[S.skSklad];
  var tvAll=skTovarlar(l);
  if(S.skTur!=='hammasi') tvAll=tvAll.filter(function(x){ return mmTur(x.tur)===S.skTur });
  var katS={}; tvAll.forEach(function(x){ katS[x.nomi]=(katS[x.nomi]||0)+(x.qoldiq>0?1:0) });
  var katlar=Object.keys(katS).sort(function(a,b){ return katS[b]-katS[a] || a.localeCompare(b,'ru') });
  if(S.skKat!=='hammasi' && !katS.hasOwnProperty(S.skKat)) S.skKat='hammasi';
  var tv=S.skKat==='hammasi'?tvAll:tvAll.filter(function(x){ return x.nomi===S.skKat });
  var son={bor:0,minus:0,yoq:0}; tv.forEach(function(x){ son[x.holat]++ });
  var fl=tv.filter(function(x){ return S.skQ==='hammasi'||x.holat===S.skQ });
  fl=mmQid(fl,['tur','nomi','tovar']).sort(function(a,b){ return S.skQ==='minus'?a.qoldiq-b.qoldiq:(b.qoldiq-a.qoldiq||String(b.oxirgi).localeCompare(String(a.oxirgi))) });
  var j=skJami(tv);
  function b(at,k,t,n){ return '<button '+at+'="'+k+'" class="'+((at==='data-skq'?S.skQ:S.skTur)===k?'on':'')+'">'+t+(n!=null?' <small style="opacity:.7">'+n+'</small>':'')+'</button>' }
  var h=sarlavha('Склад — товарлар',(S.skKat==='hammasi'?'Барча категориялар':S.skKat)+' · '+fmt(j.sku)+' тур бор · '+skBirlikMatn(j.sht,j.kv),
    '<input type="text" id="qid" placeholder="Товар номи…" value="'+esc(S.qidiruv)+'" style="width:180px">'+skSeg()+mobilTugma());
  h+='<div class="sk-chips"><button class="sk-chip'+(S.skKat==='hammasi'?' on':'')+'" data-skkat="hammasi">Ҳаммаси<b>'+tvAll.filter(function(x){ return x.qoldiq>0 }).length+'</b></button>'+
    katlar.map(function(k){ return '<button class="sk-chip'+(S.skKat===k?' on':'')+'" data-skkat="'+esc(k)+'">'+esc(k)+'<b>'+katS[k]+'</b></button>' }).join('')+'</div>';
  h+='<div class="sk-row"><div class="seg">'+b('data-skq','bor','Бор',son.bor)+b('data-skq','minus','Минус',son.minus)+b('data-skq','yoq','Тугаган',son.yoq)+b('data-skq','hammasi','Ҳаммаси')+'</div>'+
    '<div class="seg">'+b('data-sktur','hammasi','Ҳамма тур')+b('data-sktur','ser','Серийный')+b('data-sktur','pod','Под Заказ')+'</div></div>';
  h+='<div class="tw"><div class="tscroll"><table class="tbl"><thead><tr><th>Товар</th><th>Тип Заказ</th>'+
    sl.map(function(s){ return '<th style="text-align:right"><span style="color:'+skRang(s)+'">●</span> '+esc(s)+'</th>' }).join('')+
    (sl.length>1?'<th style="text-align:right">Жами</th>':'')+'<th style="text-align:right">Приход / Расход</th><th>Ҳолат</th><th>Охирги</th></tr></thead><tbody>'+
    (fl.length?fl.slice(0,500).map(function(x){
      return '<tr><td class="sk-tv"><b>'+esc(x.tovar)+'</b><span>'+esc(x.nomi)+'</span></td><td><span class="pill">'+esc(x.tur)+'</span></td>'+
        sl.map(function(s){ var v=x.sk[s]; return '<td class="num" style="text-align:right">'+(v==null?'<span style="color:var(--muted)">—</span>':skQ(v,x.kv))+'</td>' }).join('')+
        (sl.length>1?'<td class="num" style="text-align:right">'+skQ(x.qoldiq,x.kv)+'</td>':'')+
        '<td class="num" style="text-align:right;color:var(--muted)"><span style="color:var(--ok)">+'+mmSon(x.kirim)+'</span> / <span style="color:'+(x.chiqim?'var(--no)':'var(--muted)')+'">'+(x.chiqim?'−':'')+mmSon(x.chiqim)+'</span></td>'+
        '<td><span class="sk-hp '+x.holat+'">'+({bor:'Бор',minus:'Минус',yoq:'Тугаган'})[x.holat]+'</span></td>'+
        '<td class="num" style="color:var(--muted)">'+(x.oxirgi?dqisqa(x.oxirgi):'—')+'</td></tr>' }).join('')
      :'<tr><td colspan="9" style="padding:26px;text-align:center;color:var(--muted)">Товар топилмади</td></tr>')+
    '</tbody></table></div></div>'+
    '<div class="jfaqat">'+(fl.length?'<div class="jlist"><div class="jkun"><div class="jsar"><b>'+fmt(fl.length)+' та товар</b><span>'+
      ({bor:'омборда бор',minus:'минусда',yoq:'тугаган',hammasi:'ҳаммаси'})[S.skQ]+'</span></div>'+fl.slice(0,500).map(function(x){
        var sk=sl.length>1?sl.map(function(s){ return s.replace('Склад ','С')+': '+(x.sk[s]==null?'—':mmSon(x.sk[s])) }).join(' · '):'';
        return mmJkart(x.tovar,[x.nomi,x.tur,sk].filter(Boolean).join(' · '),mmSon(x.qoldiq)+' '+skBirlik(x.kv),
          ({bor:'Бор',minus:'Минус',yoq:'Тугаган'})[x.holat]+(x.oxirgi?' · '+dqisqa(x.oxirgi):''),x.qoldiq<0?'var(--no)':x.qoldiq>0?'var(--ok)':'var(--muted)') }).join('')+'</div></div>'
      :'<div class="empty">Товар топилмади</div>')+'</div>'+
    (fl.length>500?'<div class="sub" style="margin-top:10px">Биринчи 500 таси (жами '+fmt(fl.length)+')</div>':'');
  return h }

/* ── 3. ҲАРАКАТЛАР ── */
function skDiv(l){
  var m={},t=[];
  l.forEach(function(x){ var k=davrKalit(x.sana); if(!k) return; if(!m[k]){ m[k]={k:0,c:0}; t.push(k) }
    if(x.harakat==='kirim') m[k].k+=+x.soni||0; else m[k].c+=+x.soni||0 });
  t.sort(); if(!t.length) return bosh('Бу даврда ҳаракат йўқ');
  var bor=Math.max(320,(main.clientWidth||960)-74), slot=S.davr==='kun'?24:48;
  var chap=46, ong=14, tep=22, past=52, H=300, W=Math.max(bor,chap+ong+slot*t.length);
  var max=1; t.forEach(function(k){ max=Math.max(max,m[k].k,m[k].c) });
  var ich=H-tep-past, mid=tep+ich/2, yarim=ich/2-12, qad=(W-chap-ong)/t.length, bw=Math.max(5,Math.min(28,qad*.6));

  for(var k=0;k<900;k++){ var n2=nl[tas(nl.length)], kv=n2==='кух гар'||Math.random()<0.08, kir=Math.random()<0.58;
    ros.push({sana:sanaN(tas(60)), tur:kv?'Под Заказ':'Серийный', harakat:kir?'kirim':'chiqim', nomi:n2, tovar:NOM[n2][tas(NOM[n2].length)], birlik:kv?'КВ':'',

  var kass=['Основной каса','Терминал'], st={kirim:['из Маъруф сех','От клиентов','из Човид евон','онлайн интернет'],chiqim:['аванс корграо','Запчасти','Зарплаты','абед сех','налог']};
  d.moliya=[]; for(var m=0;m<500;m++){ var kr=Math.random()<0.55, s=st[kr?'kirim':'chiqim'];
    d.moliya.push({sana:sanaN(tas(60)), kassa:kass[tas(2)], tip:kr?'kirim':'chiqim', asosiy:s[tas(s.length)], stadiya:'', kichik:'', summa:[150,400,1300,2340,6900,15000][tas(6)], valyuta:'UZS', izoh:''}) }
  d.praktikum=[]; d.reja={praktikum:[],kouch:[]}; d.marketing=null;
  d.it=it; d.ros=ros; d.yuk=d.yuk||{}; d.yuk.it=Date.now(); d.yuk.ros=Date.now();
  return d };

      manba:manba[tas(5)], produkt:produkt[tas(3)], kelishuv:kel, tolangan:tol, qarz:Math.max(0,kel-tol), kishi:1, kelmagan:Math.random()<0.1?1:0, tel:'+998 9'+tas(9)+' '+(100+tas(900))+' '+(10+tas(90))+' '+(10+tas(90))});
  }
  var reja={praktikum:[{rop:rop[0],reja:120,fakt:sotuv.filter(function(x){ return x.rop===rop[0] && x.sana>=sanaN(29) }).length},
                       {rop:rop[1],reja:110,fakt:sotuv.filter(function(x){ return x.rop===rop[1] && x.sana>=sanaN(29) }).length}], kouch:[]};
  var kassa=['Нақд касса','Банк ҳисоби','Click/Payme','USD касса'];

  var moliya=[];

    var kirMi=Math.random()<0.55, y=kirMi?kir[tas(kir.length)]:chq[tas(chq.length)], usd=Math.random()<0.15;
    moliya.push({sana:sanaN(tas(60)), kassa:usd?kassa[3]:kassa[tas(3)], tip:kirMi?'kirim':'chiqim', asosiy:y[0], stadiya:y[1], kichik:y[2],
      summa:usd?[100,300,500,1200][tas(4)]:[800000,1500000,3200000,5000000,12000000][tas(5)], valyuta:usd?'USD':'UZS',
      izoh:Math.random()<0.3?'Изоҳ: '+y[1]+' бўйича '+(j+1)+'-ёзув. Батафсил тушунтириш шу ерда туради — қаторни боссангиз очилади.':''});
  }

  var stad=[['Янги лид','yangi'],['Обработка','obrabotka'],['Кўтармади','sifatsiz'],['База','sifatsiz'],['Сделка провалена','sifatsiz'],['Тошкент 16','sotuv'],['Онлайн интенсив','sotuv'],['Думает','obrabotka']];

function hozirMatn(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':00' }
